function sportHistory() {
  const f = ui.sport.filter, sports = S().sports;
  let logs = allLogs().slice();
  if (f !== 'all') logs = logs.filter(l => l.sport === f);
  logs.sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
  const sp = f !== 'all' ? sportById(f) : null, useDist = !!(sp && sp.distance);
  const filters = `<div class="toolbar"><div class="pills">${pill('sport-filter', 'all', 'Alle sporten', f === 'all')}${sports.map(s => pill('sport-filter', s.id, `${s.emoji} ${esc(s.name)}`, f === s.id)).join('')}</div></div>`;
  if (!logs.length) return `${filters}<section class="card">${empty('activity', 'Nog geen trainingen', `Log je eerste training${sp ? ' ' + esc(sp.name.toLowerCase()) : ''} om je voortgang te volgen.`, `<button class="btn btn-primary btn-sm" data-act="log-new">${icon('plus')}Training loggen</button>`)}</section>`;
  const totSec = logs.reduce((a, l) => a + (l.duration || 0), 0), totKm = logs.reduce((a, l) => a + (l.distance || 0), 0);
  const avgInt = logs.reduce((a, l) => a + (l.intensity || 0), 0) / logs.length;
  const withPace = logs.filter(l => l.distance >= 1 && l.duration > 0);
  const best = withPace.length ? withPace.reduce((a, l) => (l.duration / l.distance < a.duration / a.distance ? l : a)) : null;
  const topRec = sp && sp.grades ? sportRecords(sp.id).find(r => r.key === 'top') : null;
  const kpi4 = topRec ? `<div class="kpi"><span class="kpi-l">Hoogste graad</span><span class="kpi-v">${topRec.display}</span><span class="kpi-m">${fmtTxDate(topRec.date)}</span></div>` : useDist && best ? `<div class="kpi"><span class="kpi-l">Snelste tempo</span><span class="kpi-v">${fmtPace(best.duration, best.distance)}</span><span class="kpi-m">${fmtTxDate(best.date)}, ${nf(best.distance, 1)} km</span></div>`
    : `<div class="kpi"><span class="kpi-l">Gemiddelde intensiteit</span><span class="kpi-v">${nf(avgInt, 1)}<span class="kpi-of">/10</span></span><span class="kpi-m">Over alle trainingen</span></div>`;
  const cur = weekStart(today());
  const weeks = Array.from({ length: 12 }, (_, i) => addDays(cur, -7 * (11 - i)));
  const chart = barChart(weeks.map(w => {
    const e = addDays(w, 6), ls = logs.filter(l => l.date >= w && l.date <= e);
    const v = useDist ? ls.reduce((a, l) => a + (l.distance || 0), 0) : ls.reduce((a, l) => a + (l.duration || 0), 0) / 60;
    return { label: `${parseISO(w).getDate()}/${parseISO(w).getMonth() + 1}`, title: `Week van ${fmtDayLong(w)}: ${useDist ? nf(v, 1) + ' km' : fmtMin(v)}, ${ls.length} ${ls.length === 1 ? 'training' : 'trainingen'}`, bars: [{ v, cls: 'bar-one' }] };
  }), v => useDist ? nf(v, 0) + ' km' : nf(v, 0) + ' min', 34);
  const rows = logs.map(l => {
    const s = sportLabel(l.sport), pace = s.distance && l.distance && l.duration ? fmtPace(l.duration, l.distance) : '';
    const mob = [l.distance ? nf(l.distance, 2) + ' km' : '', l.duration ? fmtClock(l.duration) : '', pace].filter(Boolean).join(', ');
    return `<tr data-act="log-edit" data-id="${l.id}" tabindex="0">
      <td class="nowrap faint num hide-sm">${fmtTxDate(l.date)}</td>
      <td><div class="cell-main"><span class="cat-ic" style="--c:${s.color}">${s.emoji}</span><div class="grow"><div class="t"><span>${esc(s.name)}${l.type ? ` <span class="faint" style="font-weight:400">${esc(l.type)}</span>` : ''}</span></div>
        <div class="s">${[climbSummary(l), l.notes ? esc(l.notes) : ''].filter(Boolean).join('. ')}</div><div class="s show-sm">${fmtTxDate(l.date)}${mob ? ', ' + mob : ''}</div></div></div></td>
      <td class="ta-r num hide-sm">${l.distance ? nf(l.distance, 2) + ' km' : '<span class="faint">–</span>'}</td>
      <td class="ta-r num hide-sm">${l.duration ? fmtClock(l.duration) : '<span class="faint">–</span>'}</td>
      <td class="ta-r num hide-md">${pace || '<span class="faint">–</span>'}</td>
      <td class="ta-r num hide-md">${l.intensity ? l.intensity + '/10' : ''}</td>
      <td class="ta-r num hide-md">${l.score ? l.score + '/10' : ''}</td></tr>`;
  }).join('');
  return `${filters}
    <section class="card kpis">
      <div class="kpi"><span class="kpi-l">Trainingen</span><span class="kpi-v">${logs.length}</span><span class="kpi-m">Sinds ${fmtTxDate(logs[logs.length - 1].date)}</span></div>
      <div class="kpi"><span class="kpi-l">Totale tijd</span><span class="kpi-v">${fmtMin(totSec / 60)}</span><span class="kpi-m">Gemiddeld ${fmtMin(totSec / 60 / logs.length)}</span></div>
      <div class="kpi"><span class="kpi-l">Afstand</span><span class="kpi-v">${totKm ? nf(totKm, 1) + ' km' : '–'}</span><span class="kpi-m">${totKm ? 'Alle trainingen met afstand' : 'Geen afstand gelogd'}</span></div>
      ${kpi4}
    </section>
    <section class="card" style="margin-top:16px"><div class="card-h"><h2>${useDist ? 'Kilometers' : 'Trainingsminuten'} per week</h2><span class="faint small">Laatste 12 weken</span></div>${chart}</section>
    <section class="card" style="margin-top:16px"><div class="table-wrap"><table class="table">
      <thead><tr><th class="hide-sm" style="width:100px">Datum</th><th>Training</th><th class="ta-r hide-sm">Afstand</th><th class="ta-r hide-sm">Duur</th><th class="ta-r hide-md">Tempo</th><th class="ta-r hide-md">Intensiteit</th><th class="ta-r hide-md">Score</th></tr></thead>
      <tbody>${rows}</tbody></table></div></section>`;

/* bouldergraden invoer */
function gradeGrid(climbs) {
  const used = Object.keys(climbs).map(gIdx).filter(i => i >= 0);
  const a = Math.min(gIdx('4'), ...used), b = Math.max(gIdx('7C'), ...used);
  const rows = [];
  for (let i = a; i <= b; i++) {
    const g = GRADES[i], k = gKey(g), v = climbs[g] || { t: 0, f: 0 };
    const step = kind => `<span class="mini-step"><button type="button" data-act="gr-step" data-g="${g}" data-k="${kind}" data-dir="-1" aria-label="${kind === 't' ? 'Tops' : 'Flash'} ${g} omlaag">${icon('minus')}</button><output id="gr-${kind}-${k}">${v[kind] || 0}</output><button type="button" data-act="gr-step" data-g="${g}" data-k="${kind}" data-dir="1" aria-label="${kind === 't' ? 'Tops' : 'Flash'} ${g} omhoog">${icon('plus')}</button></span>`;
    rows.push(`<div class="gg-row ${v.t > 0 ? 'has' : ''}" id="gg-${k}"><b>${g}</b>${step('t')}${step('f')}</div>`);
  }
  return `<div class="grade-grid"><div class="gg-row gg-head"><span>Graad</span><span>Tops</span><span>Waarvan flash</span></div>${rows.join('')}</div>`;
}
function grSummary() { const el = document.getElementById('gr-sum'); if (!el) return; const s = climbSummary({ climbs: modalCtx.climbs || {} }); el.textContent = s ? cap(s) : 'Tik op + bij de graden die je hebt getopt.'; }
actions['gr-step'] = el => {
  const g = el.dataset.g, k = el.dataset.k, c = modalCtx.climbs = modalCtx.climbs || {};
  const v = c[g] = c[g] || { t: 0, f: 0 };
  v[k] = Math.max(0, (v[k] || 0) + (+el.dataset.dir));
  if (k === 'f' && v.f > v.t) v.t = v.f;
  if (k === 't' && v.t < v.f) v.f = v.t;
  const key = gKey(g);
  document.getElementById('gr-t-' + key).textContent = v.t; document.getElementById('gr-f-' + key).textContent = v.f;
  document.getElementById('gg-' + key).classList.toggle('has', v.t > 0);
  grSummary();
};

/* records */
function sportRecords(sid) {
  const sp = sportById(sid); if (!sp) return [];
  const logs = allLogs().filter(l => l.sport === sid); if (!logs.length) return [];
  const recs = [];
  const best = (list, val, low) => list.reduce((a, l) => { const v = val(l); return a === null || (low ? v < a.v : v > a.v) ? { v, l } : a; }, null);
  if (sp.distance) {
    const runs = logs.filter(l => l.distance > 0 && l.duration > 0);
    for (const [D, label] of [[5, 'Snelste 5 km'], [10, 'Snelste 10 km'], [21.0975, 'Snelste halve marathon']]) {
      const b = best(runs.filter(l => l.distance >= D * 0.98), l => l.duration * D / l.distance, true);
      if (b) recs.push({ key: 'd' + D, label, val: Math.round(b.v), display: fmtClock(b.v), date: b.l.date, logId: b.l.id, note: b.l.distance > D * 1.03 ? `uit een run van ${nf(b.l.distance, 1)} km` : '' });
    }
    const p = best(runs.filter(l => l.distance >= 1), l => l.duration / l.distance, true);
    if (p) recs.push({ key: 'pace', label: 'Snelste tempo', val: Math.round(p.v), display: fmtClock(p.v) + '/km', date: p.l.date, logId: p.l.id, note: `${nf(p.l.distance, 1)} km` });
    const d = best(runs, l => l.distance, false);
    if (d) recs.push({ key: 'dist', label: 'Langste afstand', val: d.v, display: nf(d.v, 2) + ' km', date: d.l.date, logId: d.l.id, note: fmtClock(d.l.duration) });
  }
  if (sp.grades) {
    const top = best(logs.filter(l => Object.values(l.climbs || {}).some(v => v.t > 0)), l => Math.max(...Object.entries(l.climbs).filter(([, v]) => v.t > 0).map(([g]) => gIdx(g))), false);
    if (top) recs.push({ key: 'top', label: 'Hoogste graad getopt', val: top.v, display: GRADES[top.v], date: top.l.date, logId: top.l.id, note: '' });
    const fl = best(logs.filter(l => Object.values(l.climbs || {}).some(v => v.f > 0)), l => Math.max(...Object.entries(l.climbs).filter(([, v]) => v.f > 0).map(([g]) => gIdx(g))), false);
    if (fl) recs.push({ key: 'flash', label: 'Hoogste flash', val: fl.v, display: GRADES[fl.v], date: fl.l.date, logId: fl.l.id, note: '' });
    const tops = best(logs.filter(l => l.climbs), l => Object.values(l.climbs).reduce((a, v) => a + (v.t || 0), 0), false);
    if (tops && tops.v > 0) recs.push({ key: 'tops', label: 'Meeste tops in één sessie', val: tops.v, display: `${tops.v} tops`, date: tops.l.date, logId: tops.l.id, note: '' });
  }
  const long = best(logs.filter(l => l.duration > 0), l => l.duration, false);
  if (long) recs.push({ key: 'long', label: 'Langste training', val: long.v, display: fmtMin(long.v / 60), date: long.l.date, logId: long.l.id, note: long.l.type || '' });
  const weeks = {};
  for (const l of logs) { const w = weekStart(l.date), x = weeks[w] = weeks[w] || { n: 0, km: 0 }; x.n++; x.km += l.distance || 0; }
  const wn = Object.entries(weeks).sort((a, b) => b[1].n - a[1].n || a[0].localeCompare(b[0]))[0];
  if (wn) recs.push({ key: 'wk-n', label: 'Meeste trainingen in een week', val: wn[1].n, display: `${wn[1].n}×`, date: wn[0], logId: null, note: `week van ${fmtDayLong(wn[0])}` });
  if (sp.distance) {
    const wk = Object.entries(weeks).sort((a, b) => b[1].km - a[1].km)[0];
    if (wk && wk[1].km > 0) recs.push({ key: 'wk-km', label: 'Meeste km in een week', val: wk[1].km, display: nf(wk[1].km, 1) + ' km', date: wk[0], logId: null, note: `week van ${fmtDayLong(wk[0])}` });
  }
  return recs;
}
function sportRecordsView() {
  const s = S();
  if (!s.sports.length) return `<section class="card">${empty('trophy', 'Nog geen sporten', 'Voeg eerst een sport toe.', `<button class="btn btn-sm" data-act="settings-sports">Naar instellingen</button>`)}</section>`;
  let sid = ui.sport.rec; if (!sid || !sportById(sid)) sid = ui.sport.rec = s.sports[0].id;
  const sp = sportById(sid), recs = sportRecords(sid);
  const pills = `<div class="toolbar"><div class="pills">${s.sports.map(x => pill('rec-sport', x.id, `${x.emoji} ${esc(x.name)}`, x.id === sid)).join('')}</div></div>`;
  const tiles = recs.length ? `<div class="rec-grid">${recs.map(r => `<${r.logId ? 'button' : 'div'} class="card rec" ${r.logId ? `data-act="log-edit" data-id="${r.logId}"` : ''}>
      <span class="kpi-l">${icon('trophy')}${r.label}</span><span class="kpi-v">${r.display}</span><span class="kpi-m">${r.logId ? fmtTxDate(r.date) + (r.note ? ', ' + esc(r.note) : '') : 'Week van ' + fmtDayLong(r.date)}</span></${r.logId ? 'button' : 'div'}>`).join('')}</div>`
    : `<section class="card">${empty('trophy', 'Nog geen records', `Records verschijnen vanzelf zodra je trainingen ${esc(sp.name.toLowerCase())} logt.`, `<button class="btn btn-sm" data-act="log-new">${icon('plus')}Training loggen</button>`)}</section>`;
  const pyr = sp.grades ? `<section class="card" style="margin-top:16px">
      <div class="card-h"><div class="card-t"><h2>Graadpiramide</h2><span class="legend-inline"><span><i style="background:color-mix(in srgb, ${sp.color} 35%, var(--panel))"></i>Tops</span><span><i style="background:${sp.color}"></i>Flash</span></span></div>${seg('pyr-period', ui.sport.pyr, [['30', '30 dagen'], ['90', '90 dagen'], ['all', 'Alles']], 'inline')}</div>
      ${pyramid(sp, ui.sport.pyr)}</section>` : '';
  return pills + tiles + pyr;
}
function pyramid(sp, period) {
  const since = period === 'all' ? '0000' : addDays(today(), -(+period)), tot = {};
  for (const l of allLogs()) if (l.sport === sp.id && l.date >= since) for (const [g, v] of Object.entries(l.climbs || {})) if (v.t > 0) { const x = tot[g] = tot[g] || { t: 0, f: 0 }; x.t += v.t; x.f += v.f || 0; }
  const gs = Object.keys(tot).sort((a, b) => gIdx(b) - gIdx(a));
  if (!gs.length) return empty('mountain', 'Nog geen tops gelogd', 'Log bij een training welke graden je hebt getopt, dan bouwt je piramide zich vanzelf op.');
  const mx = Math.max(...gs.map(g => tot[g].t));
  return `<ul class="pyr" style="--c:${sp.color}">${gs.map(g => `<li><b>${g}</b><span class="track"><i class="t" style="width:${(tot[g].t / mx * 100).toFixed(1)}%"></i><i class="f" style="width:${(tot[g].f / mx * 100).toFixed(1)}%"></i></span><span class="num faint small">${tot[g].t}${tot[g].f ? `, ${tot[g].f} flash` : ''}</span></li>`).join('')}</ul>`;
}

actions['pyr-period'] = el => { ui.sport.pyr = el.dataset.v; render(); };

/* doelvoorspelling */
function forecast(g) {
  const m = g.metric; if (!m || !sportById(g.sport)) return null;
  const since = addDays(today(), -90), logs = allLogs().filter(l => l.sport === g.sport && l.date >= since);
  if (m.kind === 'time' && m.distance > 0 && m.time > 0) {
    const D = m.distance, min = Math.max(1.5, D * 0.3);
    const runs = logs.filter(l => l.distance >= min && l.duration > 0);
    if (!runs.length) return { text: 'Nog geen voorspelling', sub: `Log een run van minstens ${nf(min, 1)} km om een voorspelling te zien.`, badge: '' };
    let b = null;
    for (const l of runs) { const p = l.duration * Math.pow(D / l.distance, 1.06); if (!b || p < b.p) b = { p, l }; }
    const diff = b.p - m.time;
    return {
      text: `Voorspeld ${fmtClock(b.p)}`,
      sub: `Doel ${fmtClock(m.time)}, dat is ${fmtPace(m.time, D)}. Je voorspelde tempo is ${fmtPace(b.p, D)}, op basis van ${fmtTxDate(b.l.date)}: ${nf(b.l.distance, 1)} km in ${fmtClock(b.l.duration)}.`,
      badge: diff <= 0 ? '<span class="badge badge-green">Binnen bereik</span>' : `<span class="badge badge-amber">Nog ${fmtClock(diff)} eraf</span>`
    };
  }
  if (m.kind === 'grade' && m.grade) {
    let top = -1, tl = null;
    for (const l of logs) for (const [gr, v] of Object.entries(l.climbs || {})) if (v.t > 0 && gIdx(gr) > top) { top = gIdx(gr); tl = l; }
    if (top < 0) return { text: 'Nog geen tops gelogd', sub: 'Log je tops per graad bij een training.', badge: '' };
    const gap = gIdx(m.grade) - top;
    return { text: `Hoogste top: ${GRADES[top]}`, sub: `In de laatste 90 dagen, op ${fmtTxDate(tl.date)}. Doel ${m.grade}.`, badge: gap <= 0 ? '<span class="badge badge-green">Gehaald</span>' : `<span class="badge badge-amber">Nog ${gap} ${gap === 1 ? 'graad' : 'graden'}</span>` };
  }
  return null;
}

<script>
/* ---------- 5f. Weekoverzicht ---------- */
registerModule({ id: 'week', label: 'Weekoverzicht', short: 'Week', icon: 'calRange', order: 70, mobile: false, render: renderWeek });

function isoWeek(s) {
  const d = parseISO(s), t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  return Math.ceil(((t - new Date(Date.UTC(t.getUTCFullYear(), 0, 1))) / 86400000 + 1) / 7);
}
function weekStats(ws) {
  const we = addDays(ws, 6), t = today();
  const days = [0, 1, 2, 3, 4, 5, 6].map(i => addDays(ws, i));
  const goals = rangeScore(ws, we);
  const perGoal = S().goals.map(g => { let a = 0, n = 0; for (const d of days) if (d <= t && appliesOn(g, d)) { n++; if (goalDone(g, d)) a++; } return { g, a, n }; }).filter(x => x.n);
  const dayScores = days.map(d => ({ d, s: d <= t ? score(d) : null }));
  const txs = txIn(ws, we), fin = sums(txs);
  const cats = {}; for (const x of txs) if (x.type === 'out') cats[x.category] = (cats[x.category] || 0) + x.amount;
  const biggest = txs.filter(x => x.type === 'out').sort((a, b) => b.amount - a.amount)[0];
  const logs = allLogs().filter(l => l.date >= ws && l.date <= we).sort((a, b) => a.date.localeCompare(b.date));
  const sMin = logs.reduce((a, l) => a + (l.duration || 0), 0) / 60, km = logs.reduce((a, l) => a + (l.distance || 0), 0);
  const study = allStudy().filter(s => s.date >= ws && s.date <= we);
  const stDone = study.filter(s => s.done).reduce((a, s) => a + (s.duration || 0), 0), stPlan = study.reduce((a, s) => a + (s.duration || 0), 0);
  const dls = deadlines().filter(d => d.date >= ws && d.date <= we).sort(sortDl);
  return { ws, we, days, goals, perGoal, dayScores, fin, cats, biggest, logs, sMin, km, study, stDone, stPlan, dls };
}

function renderWeek() {
  const ws = ui.wk.start, t = today(), cur = weekStart(t);
  const w = weekStats(ws), p = weekStats(addDays(ws, -7));
  const pct = x => x.goals.total ? Math.round(x.goals.pct * 100) : 0;
  const best = w.dayScores.filter(x => x.s && x.s.total).sort((a, b) => b.s.pct - a.s.pct || b.s.done - a.s.done)[0];
  const nws = addDays(ws, 7), nwe = addDays(nws, 6);
  const nextDl = deadlines().filter(d => !d.done && d.date >= nws && d.date <= nwe).sort(sortDl);
  const nextTrain = []; for (let i = 0; i < 7; i++) { const d = addDays(nws, i); for (const pl of planOn(d)) if (pl.sport !== 'rest') nextTrain.push([d, pl]); }
  const nextStudy = studyMinutes(nws, nwe, false);
  const nextEv = []; for (let i = 0; i < 7; i++) nextEv.push(...eventsOn(addDays(nws, i)));
  const recs = S().sports.flatMap(sp => sportRecords(sp.id).filter(r => r.logId && r.date >= ws && r.date <= w.we).map(r => ({ ...r, sp })));
  const isCur = ws === cur;

  const dayStrip = `<div class="daystrip">${w.dayScores.map(({ d, s }, i) => { const v = s && s.total ? Math.round(s.pct * 100) : null; return `<button class="ds ${d === t ? 'today' : ''}" data-act="goals-day" data-date="${d}" ${d > t ? 'disabled' : ''}><span class="ds-bar"><i style="height:${v == null ? 0 : Math.max(4, v)}%"></i></span><span class="ds-v">${v == null ? '–' : v + '%'}</span><span class="ds-d">${WD[i]}</span></button>`; }).join('')}</div>`;
  const goalRows = w.perGoal.map(x => `<li><div class="sl-top"><span>${esc(x.g.name)}</span><span class="faint small num">${x.a} van ${x.n} ${x.n === 1 ? 'dag' : 'dagen'}</span></div><div class="bar"><i style="width:${x.a / x.n * 100}%"></i></div></li>`).join('');
  const catRows = Object.entries(w.cats).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const mx = catRows.length ? catRows[0][1] : 1;
  const perCourse = {}; for (const s of w.study) { const k = s.course || ''; const x = perCourse[k] = perCourse[k] || { d: 0, p: 0 }; x.p += s.duration || 0; if (s.done) x.d += s.duration || 0; }

  return {
    title: 'Weekoverzicht',
    sub: `Week ${isoWeek(ws)}, ${fmtRange(ws, w.we)}`,
    body: `<div class="toolbar">
        <button class="btn btn-sm" data-act="wk-to" data-v="${cur}" ${isCur ? 'disabled' : ''}>Deze week</button>
        ${navArrows('wk-nav', false, ws >= cur, 'Vorige week', 'Volgende week')}
        <h2 class="tb-title">Week ${isoWeek(ws)}<span>${fmtRange(ws, w.we)}${isCur ? ', loopt nog' : ''}</span></h2>
      </div>
      <section class="card kpis">
        <div class="kpi"><span class="kpi-l">${icon('goals')}Doelen behaald</span><span class="kpi-v">${w.goals.total ? pct(w) + '%' : '–'}</span><span class="kpi-m">${deltaText(pct(w), p.goals.total ? pct(p) : null, 'up', v => v + ' procentpunt')}</span></div>
        <div class="kpi"><span class="kpi-l">${icon('cap')}Gestudeerd</span><span class="kpi-v">${fmtHours(w.stDone)}<span class="kpi-of"> / ${fmtHours(w.stPlan)}</span></span><span class="kpi-m">${deltaText(w.stDone, p.stDone, 'up', v => fmtHours(v))}</span></div>
        <div class="kpi"><span class="kpi-l">${icon('arrowOut')}Uitgegeven</span><span class="kpi-v">${eur(w.fin.out)}</span><span class="kpi-m">${deltaText(w.fin.out, p.fin.out, 'down', v => eur(v))}</span></div>
        <div class="kpi"><span class="kpi-l">${icon('activity')}Trainingen</span><span class="kpi-v">${w.logs.length}<span class="kpi-of">${w.sMin ? ', ' + fmtMin(w.sMin) : ''}</span></span><span class="kpi-m">${deltaText(w.logs.length, p.logs.length, 'up', v => String(v))}</span></div>
      </section>
      <div class="dash">
        <div class="col">
          <section class="card"><div class="card-h"><h2>Doelen per dag</h2><span class="faint small">${w.goals.done} van ${w.goals.total} behaald</span></div>
            <div class="card-b">${dayStrip}</div>
            ${goalRows ? `<ul class="stat-list" style="border-top:1px solid var(--border)">${goalRows}</ul>` : ''}
            ${best ? `<div class="card-f"><span class="inline-row">${icon('trophy')}<span>Beste dag: ${fmtLong(best.d)}, ${best.s.done} van ${best.s.total}</span></span></div>` : ''}
          </section>
          <section class="card"><div class="card-h"><h2>Studie</h2><button class="link" data-act="st-goto" data-v="planning">Planning${icon('chevR')}</button></div>
            ${w.study.length || w.dls.length ? `
              ${Object.keys(perCourse).length ? `<ul class="stat-list">${Object.entries(perCourse).sort((a, b) => b[1].p - a[1].p).map(([id, v]) => { const c = courseLabel(id); return `<li><div class="sl-top"><span class="cat-tag"><i class="dot" style="background:${c.color}"></i>${esc(c.name)}</span><span class="faint small num">${fmtHours(v.d)} van ${fmtHours(v.p)}</span></div><div class="bar"><i style="width:${v.p ? v.d / v.p * 100 : 0}%;background:${c.color}"></i></div></li>`; }).join('')}</ul>` : ''}
              ${w.dls.length ? `<div class="ag-h">Deadlines deze week<span></span></div><ul class="goals">${w.dls.map(dlRow).join('')}</ul>` : ''}`
            : empty('cap', 'Geen studie deze week', 'Er stonden geen studiesessies of deadlines in deze week.')}
          </section>
        </div>
        <div class="col">
          <section class="card"><div class="card-h"><h2>Financiën</h2><button class="link" data-act="nav" data-to="financien">Overzicht${icon('chevR')}</button></div>
            <ul class="kv-rows"><li><span>Inkomsten</span><span class="amt pos">${eur(w.fin.inc)}</span></li><li><span>Uitgaven</span><span class="amt">${eur(w.fin.out)}</span></li><li><span>Netto</span><b class="amt ${w.fin.net >= 0 ? 'pos' : 'neg'}">${eurSigned(w.fin.net)}</b></li></ul>
            ${catRows.length ? `<div class="card-b" style="border-top:1px solid var(--border)"><ul class="catbars">${catRows.map(([id, v]) => { const c = catById('out', id); return `<li style="--c:${c ? c.color : '#A1A1AA'}"><span class="cat-tag"><i class="dot" style="background:var(--c)"></i>${esc(c ? c.name : 'Zonder categorie')}</span><span class="bar"><i style="width:${(v / mx * 100).toFixed(1)}%"></i></span><span class="amt">${eur(v)}</span></li>`; }).join('')}</ul></div>` : ''}
            ${w.biggest ? `<div class="card-f"><span>Grootste uitgave: ${esc(w.biggest.description || catLabel(w.biggest))}, ${fmtTxDate(w.biggest.date)}</span><span class="amt">${eur(w.biggest.amount)}</span></div>` : ''}
          </section>
          <section class="card"><div class="card-h"><h2>Sport</h2><span class="faint small">${w.km ? nf(w.km, 1) + ' km, ' : ''}${fmtMin(w.sMin)}</span></div>
            ${w.logs.length ? `<ul class="txm-list">${w.logs.map(l => { const s = sportLabel(l.sport); return `<li><button class="txm" data-act="log-edit" data-id="${l.id}"><span class="cat-ic" style="--c:${s.color}">${s.emoji}</span><span class="grow"><span class="txm-t">${esc(s.name)}${l.type ? ', ' + esc(l.type) : ''}</span><span class="txm-s">${fmtLong(l.date)}, ${logMetrics(l).replace('Gelogd: ', '').replace('Gelogd', '')}</span></span>${recs.some(r => r.logId === l.id) ? `<span class="badge badge-green">${icon('trophy')}Record</span>` : ''}</button></li>`; }).join('')}</ul>` : empty('activity', 'Geen trainingen', 'Deze week is er nog niets gelogd.')}
            ${recs.length ? `<div class="card-f"><span class="inline-row">${icon('trophy')}<span>${recs.length} ${recs.length === 1 ? 'nieuw record' : 'nieuwe records'}: ${recs.slice(0, 2).map(r => `${esc(r.label.toLowerCase())} ${r.display}`).join(', ')}${recs.length > 2 ? ` en ${recs.length - 2} meer` : ''}</span></span><button class="link" data-act="goto-records">Records${icon('chevR')}</button></div>` : ''}
          </section>
          <section class="card"><div class="card-h"><h2>Volgende week</h2><span class="faint small">${fmtRange(nws, nwe)}</span></div>
            <ul class="kv-rows">
              <li><span class="inline-row">${icon('calendar')}Afspraken</span><span>${nextEv.length ? `${nextEv.length}: ${nextEv.slice(0, 3).map(x => `${esc(x.ev.title)} <span class="faint">(${WD[weekday(x.date)]})</span>`).join(', ')}${nextEv.length > 3 ? ', …' : ''}` : '<span class="faint">Geen</span>'}</span></li>
              <li><span class="inline-row">${icon('flag')}Deadlines</span><span>${nextDl.length ? nextDl.map(d => `${esc(d.title)} <span class="faint">(${WD[weekday(d.date)]})</span>`).join(', ') : '<span class="faint">Geen</span>'}</span></li>
              <li><span class="inline-row">${icon('cap')}Studie gepland</span><span class="num">${nextStudy ? fmtHours(nextStudy) : '<span class="faint">Nog niets</span>'}</span></li>
              <li><span class="inline-row">${icon('activity')}Trainingen gepland</span><span>${nextTrain.length ? nextTrain.map(([d, pl]) => `${sportLabel(pl.sport).emoji} <span class="faint">${WD[weekday(d)]}</span>`).join('  ') : '<span class="faint">Nog niets</span>'}</span></li>
            </ul>
          </section>
        </div>
      </div>`
  };
}
actions['wk-nav'] = el => { const n = addDays(ui.wk.start, 7 * el.dataset.n); if (n <= weekStart(today())) { ui.wk.start = n; render(); } };
actions['goto-records'] = () => { ui.sport.tab = 'records'; go('sport'); };
actions['wk-to'] = el => { ui.wk.start = el.dataset.v; render(); };
</script>
<script>
/* ---------- 5e. Instellingen ---------- */
registerModule({ id: 'instellingen', label: 'Instellingen', icon: 'settings', order: 80, mobile: false, render: renderSettings });

function renderSettings() {
  const t = ui.set.tab;
  return {
    title: 'Instellingen',
    sub: 'Doelen, agenda, sporten, financiën en je gegevens',
    tabs: tabs('set-tab', t, [['doelen', 'Dagelijkse doelen'], ['agenda', 'Agenda'], ['sport', 'Sporten'], ['financien', 'Financiën'], ['algemeen', 'Algemeen']]),
    body: `<div>${{ doelen: setGoals, agenda: setAgenda, sport: setSports, financien: setFinance, algemeen: setGeneral }[t]()}</div>`
  };
}
actions['set-tab'] = el => { ui.set.tab = el.dataset.v; render(); };
const setSec = (title, desc, body, cls = '') => `<section class="set-sec ${cls}"><div><h2>${title}</h2>${desc ? `<p class="desc">${desc}</p>` : ''}</div><div style="min-width:0">${body}</div></section>`;

/* dagelijkse doelen */
function goalDesc(g) {
  const what = g.type === 'number' ? `${g.compare === 'max' ? 'Maximaal' : 'Minimaal'} ${nf(g.target)} ${g.unit}`.trim() : 'Afvinken';
  const when = !g.days || !g.days.length || g.days.length === 7 ? 'elke dag' : 'op ' + listNL(g.days.slice().sort().map(d => WD[d]));
  return esc(`${what}, ${when}${g.link === 'training' ? ', automatisch bij een gelogde training' : g.link === 'study' ? ', automatisch uit je studieplanning' : ''}`);
}
function setGoals() {
  const gs = activeGoals();
  return setSec('Dagelijkse doelen', 'Deze doelen staan elke dag op je dashboard. De volgorde hier is de volgorde in je lijst. Een verwijderd doel blijft zichtbaar op eerdere dagen.',
    `<section class="card">
      ${gs.length ? `<ul class="row-list">${gs.map((g, i) => `<li><div class="grow"><div class="row-title">${esc(g.name)}</div><div class="row-sub">${goalDesc(g)}</div></div>
        <div class="row-actions">
          <button class="btn btn-ghost btn-sm btn-icon" data-act="goal-move" data-id="${g.id}" data-n="-1" ${i === 0 ? 'disabled' : ''} aria-label="${esc(g.name)} omhoog">${icon('chevU')}</button>
          <button class="btn btn-ghost btn-sm btn-icon" data-act="goal-move" data-id="${g.id}" data-n="1" ${i === gs.length - 1 ? 'disabled' : ''} aria-label="${esc(g.name)} omlaag">${icon('chevD')}</button>
          <button class="btn btn-sm" data-act="goal-edit" data-id="${g.id}">Bewerken</button></div></li>`).join('')}</ul>`
        : empty('goals', 'Nog geen doelen', 'Voeg je eerste dagelijkse doel toe.')}
      <div class="card-f"><span>${gs.length} ${gs.length === 1 ? 'doel' : 'doelen'}</span><button class="btn btn-sm" data-act="goal-new">${icon('plus')}Doel toevoegen</button></div>
    </section>`);
}
function openGoalModal(g) {
  const isNew = !g;
  g = g || { name: '', type: 'check', target: null, unit: '', step: 1, compare: 'min', days: [], link: null };
  const allDays = !g.days || !g.days.length;
  openModal(dlg(isNew ? 'Nieuw dagelijks doel' : 'Doel bewerken', `
    <label class="field"><span class="lbl">Naam</span><input id="gm-name" type="text" value="${esc(g.name)}" placeholder="Bijvoorbeeld Lezen"></label>
    <div class="field"><span class="lbl">Soort</span>${seg('gm-type', g.type, [['check', 'Afvinken'], ['number', 'Met een getal']])}</div>
    <div id="gm-num" ${g.type === 'number' ? '' : 'hidden'}>
      <div class="row2">
        <label class="field"><span class="lbl">Doelwaarde</span><input id="gm-target" type="text" inputmode="decimal" value="${g.target != null ? nf(g.target, 3) : ''}" placeholder="2,0"></label>
        <label class="field"><span class="lbl">Eenheid</span><input id="gm-unit" type="text" value="${esc(g.unit)}" placeholder="L, uur, stappen"></label>
      </div>
      <div class="row2">
        <label class="field"><span class="lbl">Behaald bij</span><select id="gm-cmp"><option value="min">Minstens de doelwaarde</option><option value="max" ${g.compare === 'max' ? 'selected' : ''}>Hoogstens de doelwaarde</option></select></label>
        <label class="field"><span class="lbl">Stap voor + en −</span><input id="gm-step" type="text" inputmode="decimal" value="${nf(g.step || 1, 3)}"></label>
      </div>
    </div>
    <div class="field"><span class="lbl">Wanneer</span>${seg('gm-when', allDays ? 'all' : 'some', [['all', 'Elke dag'], ['some', 'Bepaalde dagen']])}
      <div id="gm-days" class="days-pick" ${allDays ? 'hidden' : ''}>${WD.map((w, i) => `<button type="button" data-act="gm-day" data-d="${i}" aria-pressed="${!allDays && g.days.includes(i)}">${w}</button>`).join('')}</div></div>
    <label class="field"><span class="lbl">Automatisch invullen</span><select id="gm-link">
      <option value="">Nee, ik vul het zelf in</option>
      <option value="training" ${g.link === 'training' ? 'selected' : ''}>Behaald als ik die dag een training log</option>
      <option value="study" ${g.link === 'study' ? 'selected' : ''}>Met de uren van afgevinkte studiesessies</option></select>
      <span class="help">Bij studie telt de app de duur van je afgevinkte sessies op, in uren. Zelf een waarde invullen kan altijd.</span></label>`,
    dlgFoot('goal-save', 'Opslaan', isNew ? '' : `<button class="btn btn-ghost btn-danger" data-act="goal-del">${icon('trash')}Verwijderen</button>`)),
    { id: isNew ? null : g.id, type: g.type }, isNew ? '#gm-name' : null);
}
actions['goal-new'] = () => openGoalModal(null);
actions['goal-edit'] = el => { const g = goalById(el.dataset.id); if (g) openGoalModal(g); };
actions['gm-type'] = el => { pressIn(el); modalCtx.type = el.dataset.v; $('#gm-num').hidden = el.dataset.v !== 'number'; };
actions['gm-when'] = el => { pressIn(el); $('#gm-days').hidden = el.dataset.v === 'all'; };
actions['gm-day'] = el => el.setAttribute('aria-pressed', String(el.getAttribute('aria-pressed') !== 'true'));
actions['goal-save'] = () => {
  const name = $('#gm-name').value.trim();
  if (!name) return formErr('Geef het doel een naam.', '#gm-name');
  const type = modalCtx.type;
  let target = null, unit = '', step = 1, compare = 'min';
  if (type === 'number') {
    target = parseNum($('#gm-target').value);
    if (isNaN(target) || target < 0) return formErr('Vul een doelwaarde in, bijvoorbeeld 2 of 8000.', '#gm-target');
    unit = $('#gm-unit').value.trim(); compare = $('#gm-cmp').value;
    step = parseNum($('#gm-step').value); if (!(step > 0)) step = 1;
  }
  const when = ($('#sheet [data-act="gm-when"][aria-pressed="true"]') || {}).dataset;
  const days = when && when.v === 'some' ? $$('#gm-days [aria-pressed="true"]').map(b => +b.dataset.d) : [];
  if (when && when.v === 'some' && !days.length) return formErr('Kies minstens één dag.');
  const link = $('#gm-link').value || null;
  const data = { name, type, target, unit, step, compare, days: days.length === 7 ? [] : days, link };
  if (modalCtx.id) Object.assign(goalById(modalCtx.id), data);
  else S().goals.push({ id: newId(), created: today(), ...data });
  touchS(); closeModal(); toast('Doel opgeslagen'); render();
};
actions['goal-del'] = () => {
  const id = modalCtx.id, g = goalById(id); if (!g) return;
  confirmBox(`${g.name} verwijderen?`, 'Vanaf vandaag staat dit doel niet meer in je lijst. Eerdere dagen blijven bewaard.', 'Verwijderen', () => {
    const t = today();
    if ((g.created || '') >= t) S().goals = S().goals.filter(x => x.id !== id); else g.archived = t;
    touchS(); toast('Doel verwijderd'); render();
  });
};
actions['goal-move'] = el => {
  const s = S(), act = activeGoals(), g = goalById(el.dataset.id), i = act.indexOf(g), other = act[i + +el.dataset.n];
  if (!g || !other) return;
  const a = s.goals.indexOf(g), b = s.goals.indexOf(other);
  [s.goals[a], s.goals[b]] = [s.goals[b], s.goals[a]];
  touchS(); render();
};

/* agenda */
function setAgenda() {
  const cs = S().calendars;
  return setSec("Agenda's", 'Elke agenda heeft een eigen kleur. Klik op een kleur om die te wisselen. Bij Agenda, Agenda\'s kies je welke je ziet.',
    `<section class="card">
      <ul class="edit-list">${cs.map(c => `<li><button class="swatch" style="background:${c.color}" data-act="cal-color" data-id="${esc(c.id)}" aria-label="Andere kleur voor ${esc(c.name)}" title="Klik voor een andere kleur"></button>
        <input id="cal-${esc(c.id)}" type="text" value="${esc(c.name)}" data-change="cal-rename" data-id="${esc(c.id)}" aria-label="Naam">
        <span class="faint small nowrap">${allEvents().filter(e => e.cal === c.id).length} afspr.</span>
        <button class="btn btn-ghost btn-sm btn-icon" data-act="cal-del" data-id="${esc(c.id)}" aria-label="${esc(c.name)} verwijderen" ${cs.length < 2 ? 'disabled' : ''}>${icon('x')}</button></li>`).join('')}</ul>
      <div class="add-row"><input id="cal-new" type="text" placeholder="Bijvoorbeeld Sport of Familie" data-enter="cal-add"><button class="btn btn-sm" data-act="cal-add">Toevoegen</button></div>
    </section>`);
}
actions['cal-color'] = el => { const c = calById(el.dataset.id); if (!c) return; const i = PALETTE.indexOf(c.color); c.color = PALETTE[(i + 1) % PALETTE.length]; touchS(); render(); };
changes['cal-rename'] = el => { const c = calById(el.dataset.id), v = el.value.trim(); if (c && v) { c.name = v; touchS(); } render(); };
actions['cal-add'] = () => { const v = $('#cal-new').value.trim(); if (!v) return; const cs = S().calendars; cs.push({ id: newId(), name: v, color: PALETTE[(cs.length + 3) % PALETTE.length] }); touchS(); render(); const a = $('#cal-new'); if (a) a.focus(); };
actions['cal-del'] = el => {
  const s = S(), c = calById(el.dataset.id); if (!c || s.calendars.length < 2) return;
  const n = allEvents().filter(e => e.cal === c.id).length, other = s.calendars.find(x => x.id !== c.id);
  confirmBox(`${c.name} verwijderen?`, n ? `${n} ${n === 1 ? 'afspraak gaat' : 'afspraken gaan'} naar ${other.name}.` : '', 'Verwijderen', () => {
    for (const k of Object.keys(Store.b)) if (k.startsWith('ev-')) { let ch = false; for (const e of Store.b[k].items || []) if (e.cal === c.id) { e.cal = other.id; ch = true; } if (ch) Store.touch(k); }
    s.calendars = s.calendars.filter(x => x.id !== c.id); touchS(); render();
  });
};

/* sporten */
function setSports() {
  const s = S();
  return setSec('Sporten', 'Elke sport krijgt een eigen kleur in de kalender, een eigen Training Library en eigen sportdoelen.',
    `<section class="card">
      ${s.sports.length ? `<ul class="row-list">${s.sports.map(sp => `<li><span class="cat-ic" style="--c:${sp.color}">${sp.emoji}</span><div class="grow"><div class="row-title">${esc(sp.name)}</div>
        <div class="row-sub">${[sp.distance ? 'Afstand en tempo' : '', sp.grades ? 'Graden' : ''].filter(Boolean).join(', ') || 'Tijd en intensiteit'}</div></div>
        <button class="btn btn-sm" data-act="sport-edit" data-id="${sp.id}">Bewerken</button></li>`).join('')}</ul>` : empty('activity', 'Nog geen sporten', '')}
      <div class="card-f"><span>${s.sports.length} ${s.sports.length === 1 ? 'sport' : 'sporten'}</span><button class="btn btn-sm" data-act="sport-new">${icon('plus')}Sport toevoegen</button></div>
    </section>`);
}
const EMOJIS = ['🏃', '🧗', '🚴', '🏊', '🏋️', '🧘', '⚽', '🎾', '🏸', '🥊', '⛷️', '🚶'];
function openSportModal(sp) {
  const isNew = !sp, s = S();
  sp = sp || { name: '', emoji: '🏋️', distance: false, color: SPORT_COLORS[s.sports.length % SPORT_COLORS.length] };
  openModal(dlg(isNew ? 'Nieuwe sport' : 'Sport bewerken', `
    <label class="field"><span class="lbl">Naam</span><input id="sp-name" type="text" value="${esc(sp.name)}" placeholder="Bijvoorbeeld Fietsen"></label>
    <div class="field"><span class="lbl">Icoon</span><input id="sp-emoji" type="text" value="${esc(sp.emoji)}" maxlength="8" style="width:72px;font-size:20px;text-align:center">
      <div class="emoji-pick">${EMOJIS.map(e => `<button type="button" data-act="sp-emoji" data-v="${e}" aria-label="${e}">${e}</button>`).join('')}</div></div>
    <div class="field"><span class="lbl">Kleur in de kalender</span><div class="swatches">${SPORT_COLORS.map(c => `<button type="button" data-act="sp-color" data-v="${c}" style="background:${c}" aria-pressed="${c === sp.color}" aria-label="Kleur ${c}"></button>`).join('')}</div></div>
    <label class="switch"><input type="checkbox" id="sp-dist" ${sp.distance ? 'checked' : ''}><span><strong>Afstand bijhouden</strong><small>Log kilometers, zie je tempo en een voorspelde eindtijd.</small></span></label>
    <label class="switch"><input type="checkbox" id="sp-grades" ${sp.grades ? 'checked' : ''}><span><strong>Graden bijhouden</strong><small>Voor boulderen en klimmen: log je tops per graad (Fontainebleau-schaal).</small></span></label>`,
    dlgFoot('sport-save', 'Opslaan', isNew ? '' : `<button class="btn btn-ghost btn-danger" data-act="sport-del">${icon('trash')}Verwijderen</button>`)),
    { id: isNew ? null : sp.id, color: sp.color }, isNew ? '#sp-name' : null);
}
actions['sport-new'] = () => openSportModal(null);
actions['sport-edit'] = el => { const sp = sportById(el.dataset.id); if (sp) openSportModal(sp); };
actions['sp-emoji'] = el => { $('#sp-emoji').value = el.dataset.v; };
actions['sp-color'] = el => { pressIn(el); modalCtx.color = el.dataset.v; };
actions['sport-save'] = () => {
  const name = $('#sp-name').value.trim(); if (!name) return formErr('Geef de sport een naam.', '#sp-name');
  const data = { name, emoji: ($('#sp-emoji').value.trim() || '•').replace(/[<>&"']/g, ''), distance: $('#sp-dist').checked, grades: $('#sp-grades').checked, color: modalCtx.color };
  const s = S();
  if (modalCtx.id) Object.assign(sportById(modalCtx.id), data);
  else {
    const id = newId(); s.sports.push({ id, ...data });
    s.library[id] = [{ id: newId(), title: 'Warming-up', kind: 'warmup', items: [] }, { id: newId(), title: 'Trainingstypes', kind: 'types', items: [] }, { id: newId(), title: 'Cooling-down', kind: 'cooldown', items: [] }];
  }
  touchS(); closeModal(); toast('Sport opgeslagen'); render();
};
actions['sport-del'] = () => {
  const id = modalCtx.id, sp = sportById(id); if (!sp) return;
  confirmBox(`${sp.name} verwijderen?`, 'De Training Library en sportdoelen van deze sport worden verwijderd. Gelogde trainingen blijven bewaard.', 'Verwijderen', () => {
    const s = S(); s.sports = s.sports.filter(x => x.id !== id); delete s.library[id]; s.sportGoals = s.sportGoals.filter(g => g.sport !== id);
    touchS(); toast('Sport verwijderd'); render();
  });
};

/* financiën */
function catBlock(type) {
  const list = S().categories[type];
  return `<section class="card">
    <ul class="edit-list">${list.map(c => `<li><button class="swatch" style="background:${c.color}" data-act="cat-color" data-type="${type}" data-id="${esc(c.id)}" aria-label="Andere kleur voor ${esc(c.name)}" title="Klik voor een andere kleur"></button>
      <input id="cat-${esc(c.id)}" type="text" value="${esc(c.name)}" data-change="cat-rename" data-type="${type}" data-id="${esc(c.id)}" aria-label="Naam">
      <button class="btn btn-ghost btn-sm btn-icon" data-act="cat-del" data-type="${type}" data-id="${esc(c.id)}" aria-label="${esc(c.name)} verwijderen">${icon('x')}</button></li>`).join('')}</ul>
    <div class="add-row"><input id="cat-new-${type}" type="text" placeholder="Nieuwe categorie" data-enter="cat-add" data-type="${type}"><button class="btn btn-sm" data-act="cat-add" data-type="${type}">Toevoegen</button></div>
  </section>`;
}
function setFinance() {
  const s = S();
  const rec = s.recurring.map(r => {
    const c = catById(r.type, r.category);
    return `<li><div class="grow"><div class="row-title">${esc(r.description || (c ? c.name : 'Transactie'))}</div>
      <div class="row-sub">Elke maand op de ${r.day}e, volgende keer ${fmtDayLong(r.next)}</div></div>
      <span class="amt ${r.type === 'in' ? 'pos' : ''}">${r.type === 'in' ? '+' : '−'}${eur(r.amount)}</span>
      <button class="btn btn-sm" data-act="rec-stop" data-id="${r.id}">Stoppen</button></li>`;
  }).join('');
  return setSec('Startsaldo', `Je saldo is dit bedrag plus al je inkomsten min al je uitgaven tot en met vandaag. Nu: <b class="num">${eur(balance())}</b>.`,
      `<section class="card"><div class="card-b"><label class="field" style="margin:0;max-width:240px"><span class="lbl">Bedrag</span><span class="amount"><span style="font-size:15px">€</span><input id="set-sb" type="text" inputmode="decimal" value="${nf(s.startBalance || 0, 2)}" data-change="set-sb" style="height:36px;font-size:14px;font-weight:500;padding-left:26px"></span></label></div></section>`)
    + setSec('Uitgavencategorieën', 'Klik op een kleur om die te wisselen, of op een naam om die aan te passen.', catBlock('out'))
    + setSec('Inkomstencategorieën', '', catBlock('in'))
    + setSec('Rekeningen', 'Optioneel bij een transactie, handig om betaalrekening en creditcard uit elkaar te houden.',
      `<section class="card"><ul class="edit-list">${s.accounts.map((a, i) => `<li><input type="text" value="${esc(a)}" data-change="acc-rename" data-i="${i}" aria-label="Naam rekening"><button class="btn btn-ghost btn-sm btn-icon" data-act="acc-del" data-i="${i}" aria-label="${esc(a)} verwijderen">${icon('x')}</button></li>`).join('')}</ul>
        <div class="add-row"><input id="acc-new" type="text" placeholder="Bijvoorbeeld Creditcard" data-enter="acc-add"><button class="btn btn-sm" data-act="acc-add">Toevoegen</button></div></section>`)
    + setSec('Abonnementen en vaste lasten', 'Terugkerende betalingen beheer je op een eigen pagina, met wat ze per maand en per jaar kosten.',
      `<section class="card"><div class="card-b" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><span class="muted">${s.recurring.length} ${s.recurring.length === 1 ? 'terugkerende betaling' : 'terugkerende betalingen'}</span><button class="btn btn-sm" data-act="goto-subs">Naar abonnementen${icon('chevR')}</button></div></section>`);
}
actions['goto-subs'] = () => { ui.fin.tab = 'abonnementen'; go('financien'); };
changes['set-sb'] = el => { const n = parseNum(el.value); S().startBalance = isNaN(n) ? 0 : n; touchS(); toast('Startsaldo opgeslagen'); render(); };
actions['cat-color'] = el => { const c = catById(el.dataset.type, el.dataset.id); if (!c) return; const i = PALETTE.indexOf(c.color); c.color = PALETTE[(i + 1) % PALETTE.length]; touchS(); render(); };
changes['cat-rename'] = el => { const c = catById(el.dataset.type, el.dataset.id), v = el.value.trim(); if (c && v) { c.name = v; touchS(); } render(); };
actions['cat-add'] = el => {
  const type = el.dataset.type, inp = $('#cat-new-' + type), v = inp.value.trim(); if (!v) return;
  const list = S().categories[type];
  list.push({ id: newId(), name: v, color: PALETTE[list.length % PALETTE.length] }); touchS(); render();
  const again = $('#cat-new-' + type); if (again) again.focus();
};
actions['cat-del'] = el => {
  const type = el.dataset.type, c = catById(type, el.dataset.id); if (!c) return;
  const used = allTx().filter(x => x.type === type && x.category === c.id).length;
  confirmBox(`${c.name} verwijderen?`, used ? `${used} ${used === 1 ? 'transactie staat' : 'transacties staan'} daarna als "Zonder categorie".` : '', 'Verwijderen', () => {
    const s = S(); s.categories[type] = s.categories[type].filter(x => x.id !== c.id); touchS(); render();
  });
};
changes['acc-rename'] = el => { const v = el.value.trim(); if (v) { S().accounts[+el.dataset.i] = v; touchS(); } render(); };
actions['acc-del'] = el => { S().accounts.splice(+el.dataset.i, 1); touchS(); render(); };
actions['acc-add'] = () => { const v = $('#acc-new').value.trim(); if (!v) return; S().accounts.push(v); touchS(); render(); const a = $('#acc-new'); if (a) a.focus(); };
actions['rec-stop'] = el => {
  const s = S(), r = s.recurring.find(x => x.id === el.dataset.id); if (!r) return;
  confirmBox('Terugkerende transactie stoppen?', 'Eerder toegevoegde transacties blijven staan. Er komen geen nieuwe meer bij.', 'Stoppen', () => {
    s.recurring = s.recurring.filter(x => x.id !== r.id); touchS(); toast('Gestopt'); render();
  });
};

/* algemeen */
function currentTheme() { try { return localStorage.getItem('dagstaat-theme') || 'light'; } catch (e) { return 'light'; } }
const _darkMQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function applyTheme(v) {
  const dark = v === 'dark' || (v === 'system' && _darkMQ && _darkMQ.matches);
  if (dark) document.documentElement.setAttribute('data-theme', 'dark'); else document.documentElement.removeAttribute('data-theme');
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', dark ? '#141417' : '#FFFFFF');
}
if (_darkMQ && _darkMQ.addEventListener) _darkMQ.addEventListener('change', () => { if (currentTheme() === 'system') applyTheme('system'); });
function setGeneral() {
  const s = S(), cloud = Store.mode === 'cloud';
  return setSec('Profiel', 'Je naam staat in de begroeting op je dashboard.',
      `<section class="card"><div class="card-b"><label class="field" style="margin:0;max-width:320px"><span class="lbl">Naam</span><input id="set-name" type="text" value="${esc(s.profileName || '')}" placeholder="Je voornaam" data-change="set-name" autocomplete="given-name"></label></div></section>`)
    + setSec('Weergave', 'Licht is de standaard. Systeem volgt de licht- of donkermodus van je apparaat.',
      `<section class="card"><div class="card-b">${seg('theme', currentTheme(), [['light', icon('sun') + 'Licht'], ['dark', icon('moon') + 'Donker'], ['system', icon('laptop') + 'Systeem']])}</div></section>`)
    + setSec('Opslag', cloud ? 'Je gegevens staan privé in je claude.ai-account. Ook als je deze pagina deelt, ziet niemand anders ze.' : 'Open de app via claude.ai om je gegevens in je account op te slaan en op al je apparaten te zien.',
      `<section class="card"><div class="card-b"><div class="status-row ${cloud ? 'ok' : ''}">${icon(cloud ? 'cloud' : Store.mode === 'local' ? 'monitor' : 'loader', Store.mode === 'starting' ? 'spin' : '')}${cloud ? 'Gesynchroniseerd met je account' : Store.mode === 'local' ? 'Alleen opgeslagen in deze browser' : 'Gegevens laden…'}</div></div></section>`)
    + setSec('Back-up', 'Een bestand met al je doelen, transacties, trainingen en instellingen.',
      `<section class="card"><div class="card-b" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="export">${icon('download')}Back-up downloaden</button><button class="btn" data-act="import-open">${icon('upload')}Back-up terugzetten</button></div></section>`)
    + setSec('Alles wissen', 'Verwijdert al je gegevens en zet de standaardinstellingen terug. Dit kun je niet ongedaan maken.',
      `<section class="card"><div class="card-b"><button class="btn btn-danger" data-act="wipe">${icon('trash')}Alles wissen</button></div></section>`, 'danger');
}
changes['set-name'] = el => { S().profileName = el.value.trim().slice(0, 60); touchS(); toast('Naam opgeslagen'); render(); };
actions.theme = el => {
  const v = el.dataset.v;
  try { if (v === 'light') localStorage.removeItem('dagstaat-theme'); else localStorage.setItem('dagstaat-theme', v); } catch (e) { }
  applyTheme(v); render();
};
function backupJSON() { return JSON.stringify({ app: 'dagstaat', v: 4, exported: new Date().toISOString(), buckets: Store.b }, null, 2); }
actions.export = async () => {
  const data = backupJSON(), filename = `dagstaat-backup-${today()}.json`;
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { }
  if (dl) {
    try { await dl.save({ filename, data }); toast('Back-up opgeslagen'); return; }
    catch (e) { if (e && e.code === 'declined') return; }
  } else if (!window.claude) {
    try {
      const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000); toast('Back-up gedownload'); return;
    } catch (e) { }
  }
  openModal(dlg('Back-up', `<p class="dlg-text" style="margin-bottom:12px">Downloaden lukt hier niet. Kopieer de tekst hieronder en bewaar die in een bestand.</p>
    <textarea readonly rows="10" style="font-size:12px;font-family:ui-monospace,Menlo,monospace" id="bk-text">${esc(data)}</textarea>`,
    `<span class="spacer"></span><button class="btn" data-act="bk-select">Alles selecteren</button><button class="btn btn-primary" data-act="close">Klaar</button>`));
};
actions['bk-select'] = () => { const t = $('#bk-text'); t.focus(); t.select(); };
actions['import-open'] = () => {
  openModal(dlg('Back-up terugzetten', `<p class="dlg-text" style="margin-bottom:16px">Dit vervangt al je huidige gegevens door die uit de back-up.</p>
    <label class="field"><span class="lbl">Back-upbestand</span><input type="file" accept="application/json,.json" data-change="import-file"></label>
    <label class="field"><span class="lbl">Of plak de tekst van je back-up</span><textarea id="imp-text" rows="5"></textarea></label>`, dlgFoot('import-go', 'Terugzetten')));
};
changes['import-file'] = el => {
  const f = el.files && el.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => { $('#imp-text').value = String(r.result || ''); }; r.readAsText(f);
};
actions['import-go'] = () => {
  let data;
  try { data = JSON.parse($('#imp-text').value); } catch (e) { return formErr('Dit is geen geldige back-up.'); }
  if (!data || !data.buckets || !data.buckets.settings) return formErr('Dit is geen back-up van Dagstaat.');
  closeModal(); Store.replaceAll(data.buckets); processRecurring(); toast('Back-up teruggezet'); render();
};
actions.wipe = () => {
  confirmBox('Alles wissen?', 'Al je doelen, transacties, trainingen en instellingen worden verwijderd. Download eerst een back-up als je twijfelt.', 'Alles wissen', () => {
    Store.replaceAll({ settings: defaultSettings() }); toast('Alle gegevens gewist'); render();
  });
};

/* ---------- Start ---------- */
Store.loadLocal();
S();
applyTheme(currentTheme());
render();
initCloud();
try {
  const q = new URLSearchParams(location.search).get('actie');
  const map = { afspraak: 'ev-new', transactie: 'tx-new', training: 'log-new', studie: 'study-new' };
  if (q && map[q]) setTimeout(() => actions[map[q]]({ dataset: { date: today() } }), 150);
} catch (e) { }
</script>
<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
}
</script>
</body>
</html>
