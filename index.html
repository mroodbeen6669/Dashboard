function renderDashboard() {
  const t = today(), name = (S().profileName || '').trim(), h = new Date().getHours();
  const greet = h < 6 ? 'Goedenacht' : h < 12 ? 'Goedemorgen' : h < 18 ? 'Goedemiddag' : 'Goedenavond';
  return {
    title: esc(greet + (name ? ', ' + name.split(/\s+/)[0] : '')),
    sub: fmtLong(t),
    body: `${kpiStrip(t)}
      <div class="dash">
        <div class="col">${goalsCard(t)}${studyTodayCard(t)}${tomorrowCard(t)}</div>
        <div class="col">${agendaTodayCard(t)}${deadlinesCard(4)}${trainingCard(t)}${recentTxCard()}</div>
      </div>`
  };
}

function kpiStrip(t) {
  const sc = score(t), ws = weekStart(t), we = addDays(ws, 6);
  const spark = [0, 1, 2, 3, 4, 5, 6].map(i => {
    const d = addDays(ws, i);
    if (d > t) return '<i class="f" style="height:3px"></i>';
    const s = score(d);
    if (!s.total || !s.done) return `<i class="z" style="height:3px" title="${fmtLong(d)}"></i>`;
    return `<i class="${d === t ? 't' : ''}" style="height:${Math.max(12, Math.round(s.pct * 100))}%" title="${fmtLong(d)}: ${s.done} van ${s.total}"></i>`;
  }).join('');
  const m = sums(txIn(monthStart(t), monthEnd(t)));
  const wl = allLogs().filter(l => l.date >= ws && l.date <= we);
  const mins = wl.reduce((a, l) => a + (l.duration || 0), 0) / 60, km = wl.reduce((a, l) => a + (l.distance || 0), 0);
  const month = DF({ month: 'long' }).format(parseISO(t));
  return `<section class="card kpis">
    <button class="kpi" data-act="nav" data-to="doelen">
      <span class="kpi-l">${icon('goals')}Doelen vandaag</span>
      <span class="kpi-row"><span class="kpi-v">${sc.done}<span class="kpi-of">/${sc.total}</span></span><span class="spark" aria-hidden="true">${spark}</span></span>
      <span class="kpi-m">${sc.total ? Math.round(sc.pct * 100) + '% behaald' : 'Geen doelen vandaag'}</span>
    </button>
    <button class="kpi" data-act="nav" data-to="financien">
      <span class="kpi-l">${icon('wallet')}Saldo</span>
      <span class="kpi-v">${eur(balance())}</span>
      <span class="kpi-m">Per ${fmtDayLong(t)}</span>
    </button>
    <button class="kpi" data-act="nav" data-to="financien">
      <span class="kpi-l">${icon('chart')}Netto in ${month}</span>
      <span class="kpi-v ${m.net >= 0 ? 'pos' : 'neg'}">${eurSigned(m.net)}</span>
      <span class="kpi-m">${eur(m.inc)} in, ${eur(m.out)} uit</span>
    </button>
    <button class="kpi" data-act="nav" data-to="sport">
      <span class="kpi-l">${icon('activity')}Training deze week</span>
      <span class="kpi-v">${wl.length}<span class="kpi-of"> ${wl.length === 1 ? 'sessie' : 'sessies'}</span></span>
      <span class="kpi-m">${wl.length ? fmtMin(mins) + (km ? `, ${nf(km, 1)} km` : '') : 'Nog niets gelogd'}</span>
    </button>
  </section>`;
}

function goalsCard(t) {
  const sc = score(t), p = Math.round(sc.pct * 100);
  return `<section class="card">
    <div class="card-h flush"><div class="card-t"><h2>Doelen vandaag</h2><span class="badge ${sc.total && sc.done === sc.total ? 'badge-green' : ''}">${sc.done}/${sc.total}</span></div>
      <button class="link" data-act="nav" data-to="doelen">Geschiedenis${icon('chevR')}</button></div>
    <div class="card-progress"><i style="width:${p}%"></i></div>
    ${goalList(t)}
  </section>`;
}

function trainingCard(t) {
  const plans = planOn(t), logs = logsOn(t), tm = planOn(addDays(t, 1));
  const unplanned = logs.filter(l => !plans.some(p => p.sport === l.sport));
  let body = plans.map(p => evRow(p, t, logs)).join('');
  body += unplanned.map(l => `<div class="ev" style="--c:${sportColor(l.sport)}"><span class="ev-bar"></span><div class="grow"><div class="ev-t">${sportLabel(l.sport).emoji} ${esc(sportLabel(l.sport).name)}</div><div class="ev-done">${icon('check')}${logMetrics(l)}</div></div></div>`).join('');
  return `<section class="card">
    <div class="card-h"><h2>Training vandaag</h2><button class="link" data-act="nav" data-to="sport">Kalender${icon('chevR')}</button></div>
    ${body ? `<div class="card-b">${body}</div>` : empty('calendar', 'Niets gepland', 'Plan je trainingen in de sportkalender, dan zie je hier wat je vandaag doet.', `<button class="btn btn-sm" data-act="plan-new" data-date="${t}">${icon('plus')}Training plannen</button>`)}
    ${tm.length ? `<div class="card-f"><span class="inline-row">${icon('calendar')}<span>Morgen: ${tm.map(p => `${sportLabel(p.sport).emoji} ${esc(p.sport === 'rest' ? 'Rustdag' : (p.type || sportLabel(p.sport).name))}`).join(', ')}</span></span></div>` : ''}
  </section>`;
}
function evRow(p, date, logs) {
  const s = sportLabel(p.sport);
  if (p.sport === 'rest') return `<div class="ev" style="--c:var(--text-3)"><span class="ev-bar"></span><div class="grow"><div class="ev-t">😴 Rustdag</div>${p.goal ? `<div class="ev-g">${esc(p.goal)}</div>` : '<div class="ev-s">Herstel hoort er ook bij.</div>'}</div></div>`;
  const log = logs.find(l => l.sport === p.sport);
  const det = [p.type && esc(p.type), p.duration && fmtMin(p.duration)].filter(Boolean).join(', ');
  return `<div class="ev" style="--c:${s.color}"><span class="ev-bar"></span><div class="grow">
      <div class="ev-t">${s.emoji} ${esc(s.name)}</div>${det ? `<div class="ev-s">${det}</div>` : ''}${p.goal ? `<div class="ev-g">Doel: ${esc(p.goal)}</div>` : ''}
      ${log ? `<div class="ev-done">${icon('check')}${logMetrics(log)}</div>` : ''}</div>
    ${log ? '' : `<button class="btn btn-sm" data-act="log-from-plan" data-date="${date}" data-pid="${p.id}">Loggen</button>`}</div>`;
}

function recentTxCard() {
  const t = today();
  const list = allTx().filter(x => x.date <= t).slice().sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0).slice(0, 5);
  return `<section class="card">
    <div class="card-h"><h2>Recente transacties</h2><button class="link" data-act="fin-goto-tx">Alles bekijken${icon('chevR')}</button></div>
    ${list.length ? `<ul class="txm-list">${list.map(x => `<li><button class="txm" data-act="tx-edit" data-id="${x.id}">${catIcon(x)}
        <span class="grow"><span class="txm-t">${esc(x.description || catLabel(x))}</span><span class="txm-s">${esc(catLabel(x))}, ${fmtTxDate(x.date)}</span></span>
        <span class="amt ${x.type === 'in' ? 'pos' : ''}">${x.type === 'in' ? '+' : '−'}${eur(x.amount)}</span></button></li>`).join('')}</ul>`
      : empty('wallet', 'Nog geen transacties', 'Voeg je eerste uitgave of inkomsten toe om je saldo bij te houden.', `<button class="btn btn-sm" data-act="tx-new">${icon('plus')}Transactie</button>`)}
  </section>`;
}
actions['fin-goto-tx'] = () => { Object.assign(ui.fin, { tab: 'transacties', fper: 'all', type: 'all', cat: 'all', q: '' }); go('financien'); };

/* gedeelde doelenlijst */
function goalList(date) {
  const gs = goalsFor(date), td = todosFor(date);
  if (!gs.length && !td.length) return empty('goals', 'Geen doelen voor deze dag', 'Stel je dagelijkse doelen in, dan staan ze hier elke dag klaar.', `<button class="btn btn-sm" data-act="settings-goals">Doelen instellen</button>`);
  const rows = td.map(x => `<li class="goal ${x.done ? 'is-done' : ''}">
      <button class="check ${ui.pop === 'todo' + x.key + date ? 'pop' : ''}" data-act="todo-toggle" data-date="${date}" data-key="${x.key}" aria-pressed="${x.done}" aria-label="${esc(x.text)}">${icon('check')}</button>
      <div class="goal-main"><div class="goal-top"><span class="goal-name">${esc(x.text)}</span><span class="badge">Planning</span></div></div>
    </li>`);
  for (const g of gs) {
    const done = goalDone(g, date), via = viaAuto(g, date), v = goalVal(g, date);
    const autoStudy = g.link === 'study' && g.type === 'number' && viaStudy(g, date);
    let meter = '', ctrl = '';
    if (g.type === 'number') {
      const val = typeof v === 'number' ? v : 0;
      const p = g.compare === 'max' ? (typeof v === 'number' ? (v <= g.target ? 100 : Math.max(0, 100 - (v - g.target) / Math.max(g.target, 1) * 100)) : 0) : Math.min(100, g.target ? val / g.target * 100 : 0);
      meter = `<div class="goal-meter"><span class="meter"><i style="width:${p.toFixed(1)}%;${g.compare === 'max' && typeof v === 'number' && v > g.target ? 'background:var(--danger)' : ''}"></i></span>
        <span class="goal-val">${typeof v === 'number' ? nf(v, 2) : '0'} ${g.compare === 'max' ? 'van max.' : '/'} ${nf(g.target)} ${esc(g.unit)}</span></div>`;
      ctrl = `<div class="stepper">
        <button data-act="goal-step" data-id="${g.id}" data-date="${date}" data-dir="-1" aria-label="${esc(g.name)} omlaag">${icon('minus')}</button>
        <input id="gv-${g.id}-${date}" type="text" inputmode="decimal" data-change="goal-value" data-id="${g.id}" data-date="${date}" value="${typeof v === 'number' ? nf(v, 2) : ''}" placeholder="0" aria-label="${esc(g.name)}">
        <button data-act="goal-step" data-id="${g.id}" data-date="${date}" data-dir="1" aria-label="${esc(g.name)} omhoog">${icon('plus')}</button></div>`;
    }
    rows.push(`<li class="goal ${done ? 'is-done' : ''}">
      <button class="check ${ui.pop === g.id + date ? 'pop' : ''}" data-act="goal-toggle" data-id="${g.id}" data-date="${date}" aria-pressed="${done}" aria-label="${esc(g.name)}" ${via ? 'disabled' : ''}>${icon('check')}</button>
      <div class="goal-main"><div class="goal-top"><span class="goal-name">${esc(g.name)}</span>${viaTraining(g, date) ? `<span class="badge badge-green">${icon('activity')}Via training</span>` : ''}${viaStudy(g, date) ? `<span class="badge badge-green">${icon('cap')}Via studie</span>` : ''}</div>${meter}</div>
      ${ctrl}</li>`);
  }
  return `<ul class="goals">${rows.join('')}</ul>`;
}
actions['goal-toggle'] = el => {
  const g = goalById(el.dataset.id), date = el.dataset.date; if (!g) return;
  const d = ensureDay(date);
  if (g.type === 'check') { if (d.g[g.id]) delete d.g[g.id]; else d.g[g.id] = true; }
  else { if (goalDone(g, date)) delete d.g[g.id]; else d.g[g.id] = g.target; }
  ui.pop = goalDone(g, date) ? g.id + date : null;
  Store.touch(dayKey(date)); render();
};
actions['goal-step'] = el => {
  const g = goalById(el.dataset.id), date = el.dataset.date; if (!g) return;
  const d = ensureDay(date), was = goalDone(g, date);
  const cur = typeof d.g[g.id] === 'number' ? d.g[g.id] : 0;
  d.g[g.id] = Math.max(0, Math.round((cur + Number(el.dataset.dir) * (g.step || 1)) * 1000) / 1000);
  if (!was && goalDone(g, date)) ui.pop = g.id + date;
  Store.touch(dayKey(date)); render();
};
changes['goal-value'] = el => {
  const g = goalById(el.dataset.id), date = el.dataset.date; if (!g) return;
  const d = ensureDay(date), was = goalDone(g, date), n = parseNum(el.value);
  if (!el.value.trim() || isNaN(n)) delete d.g[g.id]; else d.g[g.id] = Math.max(0, n);
  if (!was && goalDone(g, date)) ui.pop = g.id + date;
  Store.touch(dayKey(date)); render();
};
actions['todo-toggle'] = el => {
  const date = el.dataset.date, k = el.dataset.key, d = ensureDay(date);
  if (d.todo[k]) delete d.todo[k]; else { d.todo[k] = true; ui.pop = 'todo' + k + date; }
  Store.touch(dayKey(date)); render();
};

const countLines = s => String(s || '').split('\n').filter(x => x.trim()).length;
function tomorrowCard(date) {
  const d = getDay(date), next = addDays(date, 1), isToday = date === today(), n = countLines(d && d.tomorrow);
  const plans = planOn(next);
  const planTxt = plans.length ? plans.map(p => { const s = sportLabel(p.sport); return `${s.emoji} ${esc(p.sport === 'rest' ? 'Rustdag' : s.name)}${p.type ? ', ' + esc(p.type) : ''}`; }).join('; ') : 'Geen training gepland';
  return `<section class="card">
    <div class="card-h"><div class="card-t"><h2>Planning voor ${isToday ? 'morgen' : fmtDayLong(next)}</h2></div><span class="faint small" id="tm-count-${date}">${n ? `${n} ${n === 1 ? 'punt' : 'punten'}` : ''}</span></div>
    <div class="card-b">
      <textarea id="tm-${date}" data-input="tomorrow" data-date="${date}" rows="4" placeholder="Eén punt per regel, bijvoorbeeld&#10;Hoofdstuk 4 samenvatten&#10;Boodschappen doen">${esc((d && d.tomorrow) || '')}</textarea>
      <p class="help">Elke regel staat ${isToday ? 'morgen' : 'die dag'} als afvinkpunt tussen je doelen.</p>
    </div>
    <div class="card-f"><span class="inline-row">${icon('activity')}<span>${planTxt}</span></span><button class="link" data-act="plan-new" data-date="${next}">${plans.length ? 'Nog een toevoegen' : 'Training plannen'}</button></div>
  </section>`;
}
inputs.tomorrow = el => {
  const d = ensureDay(el.dataset.date); d.tomorrow = el.value; Store.touch(dayKey(el.dataset.date));
  const c = document.getElementById('tm-count-' + el.dataset.date), n = countLines(el.value);
  if (c) c.textContent = n ? `${n} ${n === 1 ? 'punt' : 'punten'}` : '';
};

actions['goals-day'] = el => { ui.goals.mode = 'dag'; ui.goals.date = el.dataset.date; go('doelen'); };
actions['settings-goals'] = () => { ui.set.tab = 'doelen'; go('instellingen'); };

/* ---------- 5b. Doelen ---------- */
registerModule({ id: 'doelen', label: 'Doelen', icon: 'goals', order: 30, mobile: false, render: renderGoals });

function renderGoals() {
  const g = ui.goals, sc = score(today());
  return {
    title: 'Doelen',
    sub: sc.total ? `Vandaag ${sc.done} van ${sc.total} behaald` : 'Je dagelijkse doelen en hoe het gaat',
    actions: `<button class="btn" data-act="settings-goals">${icon('settings')}Doelen beheren</button>`,
    tabs: tabs('goals-mode', g.mode, [['dag', 'Dag'], ['week', 'Week'], ['maand', 'Maand']]),
    body: g.mode === 'dag' ? goalsDay() : g.mode === 'week' ? goalsWeek() : goalsMonth()
  };
}
actions['goals-mode'] = el => { ui.goals.mode = el.dataset.v; render(); };

function goalsDay() {
  const d = ui.goals.date, t = today(), y = addDays(t, -1), s = score(d), p = Math.round(s.pct * 100);
  const label = d === t ? 'Vandaag' : d === y ? 'Gisteren' : fmtLong(d);
  return `<div class="toolbar">
      <button class="btn btn-sm" data-act="goals-jump" data-v="${t}" ${d === t ? 'disabled' : ''}>Vandaag</button>
      ${navArrows('goals-shift', false, d >= t, 'Vorige dag', 'Volgende dag')}
      <h2 class="tb-title">${label}${d === t || d === y ? `<span>${fmtLong(d)}</span>` : ''}</h2>
    </div>
    <div class="grid-2">
      <section class="card">
        <div class="card-h flush"><div class="card-t"><h2>${s.done} van ${s.total} behaald</h2></div><span class="badge ${s.total && s.done === s.total ? 'badge-green' : ''}">${s.total ? p + '%' : '–'}</span></div>
        <div class="card-progress"><i style="width:${p}%"></i></div>
        ${goalList(d)}
      </section>
      ${tomorrowCard(d)}
    </div>`;
}
actions['goals-shift'] = el => { const n = addDays(ui.goals.date, +el.dataset.n); if (n <= today()) { ui.goals.date = n; render(); } };
actions['goals-jump'] = el => { ui.goals.date = el.dataset.v; render(); };

const cellMark = k => k === 'y' ? `<span class="wk-cell y" title="Behaald">${icon('check')}</span>` : k === 'n' ? '<span class="wk-cell n" title="Niet behaald"></span>' : k === 'na' ? '<span class="wk-cell na" title="Geldt niet op deze dag">–</span>' : '<span class="wk-cell f"></span>';

function goalsWeek() {
  const ws = ui.goals.week, t = today(), cur = weekStart(t);
  const days = [0, 1, 2, 3, 4, 5, 6].map(i => addDays(ws, i));
  const goals = S().goals.filter(g => days.some(d => d <= t && appliesOn(g, d)));
  const hasTodos = days.some(d => d <= t && todosFor(d).length);
  const rs = rangeScore(ws, days[6]), p = Math.round(rs.pct * 100);
  const head = `<thead><tr><th>Doel</th>${days.map((d, i) => `<th><button class="th-day ${d === t ? 'today' : ''}" data-act="goals-day" data-date="${d}" ${d > t ? 'disabled' : ''}>${WD[i]}<b>${parseISO(d).getDate()}</b></button></th>`).join('')}</tr></thead>`;
  const rows = goals.map(g => `<tr><td title="${esc(g.name)}">${esc(g.name)}</td>${days.map(d => `<td>${cellMark(d > t ? 'f' : !appliesOn(g, d) ? 'na' : goalDone(g, d) ? 'y' : 'n')}</td>`).join('')}</tr>`).join('');
  const todoRow = hasTodos ? `<tr><td>Planning</td>${days.map(d => { if (d > t) return `<td>${cellMark('f')}</td>`; const td = todosFor(d); return `<td>${td.length ? `<span class="small num muted">${td.filter(x => x.done).length}/${td.length}</span>` : cellMark('na')}</td>`; }).join('')}</tr>` : '';
  const foot = `<tr class="tot"><td>Behaald</td>${days.map(d => { if (d > t) return '<td></td>'; const sc = score(d); return `<td>${sc.total ? Math.round(sc.pct * 100) + '%' : '–'}</td>`; }).join('')}</tr>`;
  return `<div class="toolbar">
      <button class="btn btn-sm" data-act="goals-week-to" data-v="${cur}" ${ws === cur ? 'disabled' : ''}>Deze week</button>
      ${navArrows('goals-week', false, ws >= cur, 'Vorige week', 'Volgende week')}
      <h2 class="tb-title">${fmtRange(ws, days[6])}</h2>
    </div>
    <section class="card">
      <div class="card-h flush"><div class="card-t"><h2>${rs.done} van ${rs.total} behaald</h2></div><span class="badge ${rs.total && rs.done === rs.total ? 'badge-green' : ''}">${rs.total ? p + '%' : '–'}</span></div>
      <div class="card-progress"><i style="width:${p}%"></i></div>
      ${goals.length || hasTodos ? `<div class="table-wrap"><table class="table wk">${head}<tbody>${rows}${todoRow}${foot}</tbody></table></div>` : empty('goals', 'Geen doelen in deze week', '')}
    </section>`;
}
actions['goals-week'] = el => { const n = addDays(ui.goals.week, 7 * el.dataset.n); if (n <= weekStart(today())) { ui.goals.week = n; render(); } };
actions['goals-week-to'] = el => { ui.goals.week = el.dataset.v; render(); };

function goalsMonth() {
  const mk = ui.goals.month, t = today(), cm = t.slice(0, 7);
  const first = mk + '-01', last = monthEnd(first), end = last < t ? last : t;
  const cells = [];
  for (let i = 0; i < weekday(first); i++) cells.push('<span></span>');
  for (let d = first; d <= last; d = addDays(d, 1)) {
    const fut = d > t, sc = fut ? null : score(d), p = sc && sc.total ? sc.pct : 0;
    const lvl = !sc || !sc.total || !sc.done ? 0 : p >= 1 ? 4 : p >= .67 ? 3 : p >= .34 ? 2 : 1;
    cells.push(`<button class="heat-d l${lvl} ${d === t ? 'today' : ''}" data-act="goals-day" data-date="${d}" ${fut ? 'disabled' : ''} title="${fmtLong(d)}${sc ? `: ${sc.done} van ${sc.total}` : ''}">${parseISO(d).getDate()}</button>`);
  }
  const per = S().goals.map(g => {
    let a = 0, n = 0;
    for (let d = first; d <= end; d = addDays(d, 1)) if (appliesOn(g, d)) { n++; if (goalDone(g, d)) a++; }
    if (!n) return '';
    const p = Math.round(a / n * 100);
    return `<li><div class="sl-top"><span>${esc(g.name)}</span><span class="faint small num">${a} van ${n} ${n === 1 ? 'dag' : 'dagen'}, ${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div></li>`;
  }).join('');
  const rs = rangeScore(first, last), p = Math.round(rs.pct * 100);
  return `<div class="toolbar">
      <button class="btn btn-sm" data-act="goals-month-to" data-v="${cm}" ${mk === cm ? 'disabled' : ''}>Deze maand</button>
      ${navArrows('goals-month', false, mk >= cm, 'Vorige maand', 'Volgende maand')}
      <h2 class="tb-title">${fmtMonth(mk)}</h2>
    </div>
    <div class="grid-2">
      <section class="card">
        <div class="card-h"><div class="card-t"><h2>${rs.done} van ${rs.total} behaald</h2></div><span class="badge">${rs.total ? p + '%' : '–'}</span></div>
        <div class="card-b"><div class="heat">${WD.map(w => `<span class="heat-h">${w}</span>`).join('')}${cells.join('')}</div>
          <div class="heat-legend">Minder <i style="background:var(--hover)"></i><i style="background:color-mix(in srgb, var(--accent) 22%, var(--panel))"></i><i style="background:color-mix(in srgb, var(--accent) 45%, var(--panel))"></i><i style="background:color-mix(in srgb, var(--accent) 72%, var(--panel))"></i><i style="background:var(--accent)"></i> Meer</div></div>
      </section>
      <section class="card"><div class="card-h"><h2>Per doel</h2></div>
        ${per ? `<ul class="stat-list">${per}</ul>` : empty('chart', 'Nog geen gegevens', 'Zodra je doelen afvinkt, zie je hier per doel hoe vaak het lukte.')}</section>
    </div>`;
}
actions['goals-month'] = el => { const n = addMonths(ui.goals.month, +el.dataset.n); if (n <= today().slice(0, 7)) { ui.goals.month = n; render(); } };
actions['goals-month-to'] = el => { ui.goals.month = el.dataset.v; render(); };
</script>
<script>
/* ---------- 5b. Agenda ---------- */
registerModule({ id: 'agenda', label: 'Agenda', icon: 'calendar', order: 20, render: renderAgenda });

const REPEATS = [['none', 'Niet'], ['daily', 'Elke dag'], ['weekdays', 'Elke werkdag (ma–vr)'], ['weekly', 'Elke week'], ['biweekly', 'Om de week'], ['monthly', 'Elke maand']];
const repeatLabel = r => (REPEATS.find(x => x[0] === r) || REPEATS[0])[1];
const isMobile = () => window.matchMedia('(max-width: 860px)').matches;
const hourH = () => isMobile() ? 44 : 48;

/* items voor een dag: afspraken plus de lagen studie, sport en deadlines */
function dayItems(d) {
  const L = S().agendaLayers || {}, out = [];
  for (const { ev } of eventsOn(d)) {
    const c = calOf(ev);
    out.push({ kind: 'ev', allDay: !!ev.allDay, start: toMin(ev.start), end: Math.max(toMin(ev.end), toMin(ev.start) + 15), title: ev.title || 'Zonder titel', sub: ev.location || '', color: c.color, attrs: `data-act="ev-edit" data-id="${ev.id}" data-date="${d}"`, repeat: ev.repeat && ev.repeat !== 'none' });
  }
  if (L.study) for (const s of studyOn(d)) {
    const c = courseLabel(s.course), st = s.time ? toMin(s.time) : 0;
    out.push({ kind: 'study', allDay: !s.time, start: st, end: st + (s.duration || 60), title: s.task || c.name, sub: c.name, color: c.color, done: s.done, attrs: `data-act="study-edit" data-id="${s.id}" data-date="${d}"` });
  }
  if (L.sport) for (const p of planOn(d)) {
    const sp = sportLabel(p.sport);
    out.push({ kind: 'plan', allDay: true, title: `${sp.emoji} ${p.sport === 'rest' ? 'Rustdag' : (p.type || sp.name)}`, sub: '', color: sp.color, attrs: `data-act="plan-edit" data-pid="${p.id}" data-date="${d}"` });
  }
  if (L.deadlines) for (const x of deadlines().filter(x => x.date === d)) {
    out.push({ kind: 'dl', allDay: true, title: x.title, sub: x.time || '', color: 'var(--danger)', done: x.done, attrs: `data-act="dl-edit" data-id="${x.id}"` });
  }
  return out;
}

function renderAgenda() {
  const a = ui.agenda, t = today();
  if (!a.view) a.view = isMobile() ? 'dag' : 'week';
  let title = '', body = '', inView = false;
  if (a.view === 'dag') {
    title = `${fmtLong(a.date)}${a.date.slice(0, 4) !== t.slice(0, 4) ? ' ' + a.date.slice(0, 4) : ''}`; inView = a.date === t;
    body = timeGrid([a.date]);
  } else if (a.view === 'week') {
    const ws = weekStart(a.date), days = [0, 1, 2, 3, 4, 5, 6].map(i => addDays(ws, i));
    title = fmtRange(ws, days[6]); inView = days.includes(t);
    body = timeGrid(days);
  } else if (a.view === 'maand') {
    title = fmtMonth(a.date.slice(0, 7)); inView = a.date.slice(0, 7) === t.slice(0, 7);
    body = monthGrid(a.date.slice(0, 7));
  } else {
    title = `Vanaf ${fmtDayLong(a.date)}`; inView = a.date === t;
    body = agendaList(a.date, 30);
  }
  const n = eventsOn(t).length;
  return {
    title: 'Agenda',
    sub: n ? `Vandaag ${n} ${n === 1 ? 'afspraak' : 'afspraken'}` : 'Geen afspraken vandaag',
    actions: `<button class="btn" data-act="ag-cals">${icon('settings')}Agenda's</button>`,
    body: `<div class="toolbar">
        <button class="btn btn-sm" data-act="ag-today" ${inView ? 'disabled' : ''}>Vandaag</button>
        ${navArrows('ag-nav', false, false, 'Vorige', 'Volgende')}
        <h2 class="tb-title">${title}</h2><span class="spacer"></span>
        ${btnGroup('ag-view', a.view, [['dag', 'Dag'], ['week', 'Week'], ['maand', 'Maand'], ['lijst', 'Lijst']])}
      </div>${body}`,
    after: agendaAfter
  };
}
function agendaAfter() {
  const sc = document.getElementById('tg-scroll'); if (!sc) return;
  const HH = hourH(), now = new Date();
  if (ui.agenda.scroll == null) {
    const showsToday = !!document.querySelector('.tg-col.today');
    ui.agenda.scroll = (showsToday ? Math.min(Math.max(now.getHours() - 1, 0), 16) : 7) * HH;
  }
  sc.scrollTop = ui.agenda.scroll;
  sc.addEventListener('scroll', () => { ui.agenda.scroll = sc.scrollTop; }, { passive: true });
}
actions['ag-view'] = el => { ui.agenda.view = el.dataset.v; render(); };
actions['ag-today'] = () => { ui.agenda.date = today(); ui.agenda.scroll = null; render(); };
actions['ag-nav'] = el => {
  const a = ui.agenda, n = +el.dataset.n;
  if (a.view === 'dag') a.date = addDays(a.date, n);
  else if (a.view === 'week') a.date = addDays(a.date, 7 * n);
  else if (a.view === 'maand') a.date = addMonths(a.date.slice(0, 7), n) + '-01';
  else a.date = addDays(a.date, 30 * n);
  render();
};
actions['ag-goto-day'] = el => { ui.agenda.date = el.dataset.date; ui.agenda.view = 'dag'; render(); };

/* tijdrooster */
function layoutCols(items) {
  const sorted = items.slice().sort((a, b) => a.start - b.start || b.end - a.end);
  let cluster = [], colsEnd = [], clusterEnd = -1;
  const flush = () => { const n = colsEnd.length; cluster.forEach(it => it.ncol = n); cluster = []; colsEnd = []; };
  for (const it of sorted) {
    if (it.start >= clusterEnd && cluster.length) flush();
    let c = colsEnd.findIndex(e => e <= it.start);
    if (c < 0) { c = colsEnd.length; colsEnd.push(it.end); } else colsEnd[c] = it.end;
    it.col = c; cluster.push(it); clusterEnd = Math.max(clusterEnd, it.end);
  }
  flush();
  return sorted;
}
function timeGrid(days) {
  const HH = hourH(), t = today(), now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes();
  const head = days.map(d => `<button class="tg-dh ${d === t ? 'today' : ''}" data-act="ag-goto-day" data-date="${d}" ${days.length === 1 ? 'disabled' : ''}><span>${WD[weekday(d)]}</span><b>${parseISO(d).getDate()}</b></button>`).join('');
  const all = days.map(d => dayItems(d));
  const allday = days.map((d, i) => `<div class="tg-ad">${all[i].filter(x => x.allDay).map(x => `<button class="ad-pill ${x.kind} ${x.done ? 'done' : ''}" style="--c:${x.color}" ${x.attrs} title="${esc(x.title)}">${esc(x.title)}</button>`).join('')}</div>`).join('');
  const hasAllDay = all.some(list => list.some(x => x.allDay));
  const hours = Array.from({ length: 24 }, (_, h) => h ? `<span style="top:${h * HH}px">${pad(h)}:00</span>` : '').join('');
  const cols = days.map((d, i) => {
    const timed = layoutCols(all[i].filter(x => !x.allDay));
    const evs = timed.map(x => {
      const top = x.start / 60 * HH, h = Math.max(20, (x.end - x.start) / 60 * HH - 2), w = 100 / x.ncol;
      const short = (x.end - x.start) < 50;
      return `<button class="tg-ev ${x.kind} ${x.done ? 'done' : ''} ${short ? 'short' : ''}" style="top:${top}px;height:${h}px;left:calc(${x.col * w}% + 2px);width:calc(${w}% - 4px);--c:${x.color}" ${x.attrs}>
        <span class="tg-ev-t">${x.kind === 'study' ? icon('cap') : ''}${esc(x.title)}</span><span class="tg-ev-s">${fmtT(x.start)}–${fmtT(x.end % 1440)}${x.sub ? ', ' + esc(x.sub) : ''}</span></button>`;
    }).join('');
    return `<div class="tg-col ${d === t ? 'today' : ''} ${d < t ? 'past' : ''}" data-act="ag-slot" data-date="${d}">${evs}${d === t ? `<div class="tg-now" style="top:${nowMin / 60 * HH}px"></div>` : ''}</div>`;
  }).join('');
  return `<div class="tg card" style="--n:${days.length};--hh:${HH}px">
    <div class="tg-scroll" id="tg-scroll">
      <div class="tg-sticky">
        <div class="tg-row tg-head"><div class="tg-gut"></div>${head}</div>
        <div class="tg-row tg-allrow ${hasAllDay ? '' : 'empty'}"><div class="tg-gut tg-adl">hele dag</div>${allday}</div>
      </div>
      <div class="tg-row tg-body"><div class="tg-gut tg-times">${hours}</div>${cols}</div>
    </div></div>`;
}
actions['ag-slot'] = (el, e) => {
  if (e.target !== el) return;
  const r = el.getBoundingClientRect(), HH = hourH();
  const m = Math.min(23 * 60, Math.max(0, Math.floor((e.clientY - r.top) / HH * 2) * 30));
  openEventModal(null, { date: el.dataset.date, start: fmtT(m), end: fmtT(Math.min(m + 60, 23 * 60 + 59)) });
};

/* maand */
function monthGrid(mk) {
  const t = today(), first = mk + '-01', last = monthEnd(first), cells = [];
  for (let d = weekStart(first); d <= last || weekday(d) !== 0; d = addDays(d, 1)) {
    const items = dayItems(d).sort((a, b) => (b.allDay - a.allDay) || a.start - b.start);
    const pills = items.map(x => `<button class="mc-pill ${x.kind === 'dl' ? 'dl' : ''} ${x.done ? 'done' : ''} ${x.allDay ? 'fill' : ''}" style="--c:${x.color}" ${x.attrs} title="${esc(x.title)}">${!x.allDay ? `<span class="mc-time">${fmtT(x.start)}</span> ` : ''}${esc(x.title)}</button>`);
    cells.push(`<div class="mc-cell ${d.slice(0, 7) !== mk ? 'out' : ''} ${d === t ? 'today' : ''}" data-act="ag-cell" data-date="${d}">
      <span class="mc-n">${parseISO(d).getDate()}</span><div class="mc-items">${pills.slice(0, 4).join('')}${pills.length > 4 ? `<span class="mc-more">+${pills.length - 4} meer</span>` : ''}</div></div>`);
  }
  return `<div class="mcal">${WD.map(w => `<div class="mc-h">${w}</div>`).join('')}${cells.join('')}</div><p class="help">Klik op een lege plek in een dag om een afspraak toe te voegen. Op je telefoon opent een dag de dagweergave.</p>`;
}
actions['ag-cell'] = el => {
  if (isMobile()) { ui.agenda.date = el.dataset.date; ui.agenda.view = 'dag'; ui.agenda.scroll = null; render(); return; }
  openEventModal(null, { date: el.dataset.date, start: '09:00', end: '10:00' });
};

/* lijst */
function evListRows(d, onlyEvents) {
  const t = today(), now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes();
  return dayItems(d).filter(x => !onlyEvents || x.kind === 'ev').sort((a, b) => (b.allDay - a.allDay) || a.start - b.start).map(x => {
    const past = d < t || (d === t && !x.allDay && x.end <= nowMin), cur = d === t && !x.allDay && x.start <= nowMin && x.end > nowMin;
    return `<li><button class="ev-li ${past ? 'past' : ''} ${x.done ? 'done' : ''}" style="--c:${x.color}" ${x.attrs}>
      <span class="ev-time">${x.allDay ? 'Hele dag' : `${fmtT(x.start)}<small>${fmtT(x.end % 1440)}</small>`}</span>
      <span class="ev-bar"></span>
      <span class="grow"><span class="ev-title">${x.kind === 'study' ? icon('cap') : x.kind === 'dl' ? icon('flag') : ''}${esc(x.title)}${x.repeat ? icon('repeat') : ''}</span>${x.sub ? `<span class="ev-sub">${esc(x.sub)}</span>` : ''}</span>
      ${cur ? '<span class="badge badge-green">Nu</span>' : ''}</button></li>`;
  }).join('');
}
function agendaList(from, n) {
  const t = today(), groups = [];
  for (let i = 0; i < n; i++) {
    const d = addDays(from, i), rows = evListRows(d);
    if (rows) groups.push(`<div class="ag-h">${d === t ? 'Vandaag, ' + fmtDayLong(d) : d === addDays(t, 1) ? 'Morgen, ' + fmtDayLong(d) : fmtLong(d)}<span></span></div><ul class="ev-list">${rows}</ul>`);
  }
  return `<section class="card">${groups.length ? groups.join('') : empty('calendar', 'Niets gepland', 'In deze 30 dagen staan geen afspraken.', `<button class="btn btn-sm" data-act="ev-new">${icon('plus')}Afspraak</button>`)}</section>`;
}

/* dashboardkaart */
function agendaTodayCard(t) {
  const rows = evListRows(t, true), tm = eventsOn(addDays(t, 1));
  const firstTimed = tm.find(x => !x.ev.allDay);
  return `<section class="card">
    <div class="card-h"><h2>Agenda vandaag</h2><button class="link" data-act="ag-open-today">Agenda${icon('chevR')}</button></div>
    ${rows ? `<ul class="ev-list">${rows}</ul>` : empty('calendar', 'Geen afspraken vandaag', '', `<button class="btn btn-sm" data-act="ev-new">${icon('plus')}Afspraak</button>`)}
    <div class="card-f"><span class="inline-row">${icon('calendar')}<span>Morgen: ${tm.length ? `${tm.length} ${tm.length === 1 ? 'afspraak' : 'afspraken'}${firstTimed ? `, eerste om ${firstTimed.ev.start}` : ''}` : 'geen afspraken'}</span></span><button class="link" data-act="ev-new">Toevoegen</button></div>
  </section>`;
}
actions['ag-open-today'] = () => { ui.agenda.date = today(); ui.agenda.scroll = null; go('agenda'); };

/* agenda's tonen */
actions['ag-cals'] = () => {
  const s = S(), L = s.agendaLayers || {};
  const sw = (id, attrs, checked, title, sub, color) => `<label class="switch"><input type="checkbox" id="${id}" ${attrs} ${checked ? 'checked' : ''}><span><strong>${color ? `<i class="dot" style="background:${color};margin-right:8px"></i>` : ''}${title}</strong>${sub ? `<small>${sub}</small>` : ''}</span></label>`;
  openModal(dlg("Agenda's tonen", `
    <div class="field"><span class="lbl">Mijn agenda's</span>${s.calendars.map(c => sw('agc-' + c.id, `data-change="ag-cal-vis" data-id="${c.id}"`, !c.hidden, esc(c.name), '', c.color)).join('')}</div>
    <div class="field"><span class="lbl">Ook tonen uit de rest van de app</span>
      ${sw('agl-study', 'data-change="ag-layer" data-k="study"', L.study, 'Studiesessies', 'Met tijd in het rooster, zonder tijd bovenaan de dag')}
      ${sw('agl-sport', 'data-change="ag-layer" data-k="sport"', L.sport, 'Geplande trainingen', '')}
      ${sw('agl-deadlines', 'data-change="ag-layer" data-k="deadlines"', L.deadlines, 'Deadlines', '')}</div>`,
    `<button class="btn btn-ghost" data-act="ag-manage">${icon('pencil')}Agenda's beheren</button><span class="spacer"></span><button class="btn btn-primary" data-act="close">Klaar</button>`));
};
changes['ag-cal-vis'] = el => { const c = calById(el.dataset.id); if (c) { c.hidden = !el.checked; touchS(); requestRender(); } };
changes['ag-layer'] = el => { const s = S(); s.agendaLayers = { ...(s.agendaLayers || {}), [el.dataset.k]: el.checked }; touchS(); requestRender(); };
actions['ag-manage'] = () => { ui.set.tab = 'agenda'; go('instellingen'); };

/* afspraak toevoegen / bewerken */
function nextHourSlot() { const now = new Date(); const m = Math.min(22 * 60, (now.getHours() + 1) * 60); return [fmtT(m), fmtT(m + 60)]; }
function openEventModal(ev, preset = {}, occ) {
  const s = S(), isNew = !ev, recurring = ev && ev.repeat && ev.repeat !== 'none';
  const [ds, de] = nextHourSlot();
  const e = ev ? { ...ev } : { title: '', cal: (s.calendars.find(c => !c.hidden) || s.calendars[0] || {}).id || '', date: preset.date || (route === 'agenda' ? ui.agenda.date : today()), allDay: false, start: preset.start || ds, end: preset.end || de, endDate: '', repeat: 'none', until: '', location: '', notes: '' };
  const shownDate = recurring && occ ? occ : e.date;
  openModal(dlg(isNew ? 'Nieuwe afspraak' : 'Afspraak', `
    ${recurring ? `<div class="field"><span class="lbl">Wijzigingen gelden voor</span>${seg('ev-scope', 'one', [['one', 'Alleen deze afspraak'], ['all', 'De hele reeks']])}</div>` : ''}
    <label class="field"><span class="lbl">Titel</span><input id="ev-title" type="text" value="${esc(e.title)}" placeholder="Bijvoorbeeld Werken bij de bieb"></label>
    <div class="row2">
      <label class="field"><span class="lbl">Agenda</span><select id="ev-cal">${s.calendars.map(c => `<option value="${esc(c.id)}" ${c.id === e.cal ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
      <div class="field"><span class="lbl">&nbsp;</span><label class="switch" style="margin:6px 0 0"><input type="checkbox" id="ev-allday" data-change="ev-allday" ${e.allDay ? 'checked' : ''}><span><strong>Hele dag</strong></span></label></div>
    </div>
    <div class="row2">
      <label class="field"><span class="lbl">Datum</span><input id="ev-date" type="date" value="${shownDate}"></label>
      <label class="field" id="ev-enddate-f" ${e.allDay ? '' : 'hidden'}><span class="lbl">Tot en met <span class="faint">(optioneel)</span></span><input id="ev-enddate" type="date" value="${e.endDate || ''}"></label>
    </div>
    <div class="row2" id="ev-times" ${e.allDay ? 'hidden' : ''}>
      <label class="field"><span class="lbl">Van</span><input id="ev-start" type="time" value="${e.start}" data-change="ev-start"></label>
      <label class="field"><span class="lbl">Tot</span><input id="ev-end" type="time" value="${e.end}"></label>
    </div>
    <div class="row2">
      <label class="field"><span class="lbl">Herhalen</span><select id="ev-repeat" data-change="ev-repeat">${REPEATS.map(([v, l]) => `<option value="${v}" ${v === (e.repeat || 'none') ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <label class="field" id="ev-until-f" ${e.repeat && e.repeat !== 'none' ? '' : 'hidden'}><span class="lbl">Tot en met <span class="faint">(optioneel)</span></span><input id="ev-until" type="date" value="${e.until || ''}"></label>
    </div>
    <label class="field"><span class="lbl">Locatie <span class="faint">(optioneel)</span></span><input id="ev-loc" type="text" value="${esc(e.location || '')}" placeholder="Bijvoorbeeld Science Park"></label>
    <label class="field"><span class="lbl">Notities <span class="faint">(optioneel)</span></span><textarea id="ev-notes" rows="2">${esc(e.notes || '')}</textarea></label>`,
    dlgFoot('ev-save', 'Opslaan', isNew ? '' : `<button class="btn btn-ghost btn-danger" data-act="ev-delete">${icon('trash')}Verwijderen</button>`)),
    { id: isNew ? null : ev.id, occ: occ || null, scope: 'one', seriesDate: ev ? ev.date : null }, isNew ? '#ev-title' : null);
}
actions['ev-new'] = () => openEventModal(null);
actions['ev-edit'] = el => { const ev = findEvent(el.dataset.id); if (ev) openEventModal(ev, {}, el.dataset.date); };
actions['ev-scope'] = el => { pressIn(el); modalCtx.scope = el.dataset.v; $('#ev-date').value = el.dataset.v === 'all' ? modalCtx.seriesDate : modalCtx.occ; };
changes['ev-allday'] = el => { $('#ev-times').hidden = el.checked; $('#ev-enddate-f').hidden = !el.checked; };
changes['ev-repeat'] = el => { $('#ev-until-f').hidden = el.value === 'none'; };
changes['ev-start'] = el => {
  const st = toMin(el.value), en = toMin($('#ev-end').value);
  if (en <= st) $('#ev-end').value = fmtT(Math.min(st + 60, 23 * 60 + 59));
};
actions['ev-save'] = () => {
  const date = $('#ev-date').value; if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return formErr('Kies een datum.', '#ev-date');
  const allDay = $('#ev-allday').checked, start = $('#ev-start').value || '09:00', end = $('#ev-end').value || '10:00';
  if (!allDay && toMin(end) <= toMin(start)) return formErr('De eindtijd moet na de begintijd liggen.', '#ev-end');
  const endDate = allDay ? ($('#ev-enddate').value || '') : '';
  if (endDate && endDate < date) return formErr('De einddatum ligt voor de begindatum.', '#ev-enddate');
  const data = { title: $('#ev-title').value.trim() || 'Afspraak', cal: $('#ev-cal').value, date, allDay, start, end, endDate: endDate > date ? endDate : '', repeat: $('#ev-repeat').value, until: $('#ev-repeat').value !== 'none' ? ($('#ev-until').value || '') : '', location: $('#ev-loc').value.trim(), notes: $('#ev-notes').value.trim() };
  const { id, occ, scope } = modalCtx, orig = id ? findEvent(id) : null;
  if (orig && orig.repeat && orig.repeat !== 'none' && scope === 'one') {
    const ex = { ...orig, exdates: [...(orig.exdates || []), occ] };
    removeEvent(orig.id); putEvent(ex);
    putEvent({ ...data, id: newId(), repeat: 'none', until: '' });
  } else {
    if (orig) removeEvent(orig.id);
    putEvent({ ...(orig || {}), ...data, id: orig ? orig.id : newId(), exdates: orig && orig.date === data.date ? (orig.exdates || []) : [] });
  }
  closeModal(); toast(orig ? 'Afspraak bijgewerkt' : 'Afspraak toegevoegd'); render();
};
actions['ev-delete'] = () => {
  const { id, occ } = modalCtx, ev = findEvent(id); if (!ev) return;
  if (ev.repeat && ev.repeat !== 'none') {
    openModal(dlg('Herhalende afspraak verwijderen', `<p class="dlg-text">Wil je alleen de afspraak van ${fmtLong(occ || ev.date)} verwijderen, of de hele reeks?</p>`,
      `<span class="spacer"></span><button class="btn" data-act="close">Annuleren</button><button class="btn" data-act="ev-del-one">Alleen deze</button><button class="btn btn-danger-solid" data-act="ev-del-all">Hele reeks</button>`), { id, occ });
  } else confirmBox('Afspraak verwijderen?', ev.title, 'Verwijderen', () => { removeEvent(id); toast('Afspraak verwijderd'); render(); });
};
actions['ev-del-one'] = () => {
  const { id, occ } = modalCtx, ev = findEvent(id); if (!ev) return;
  const ex = { ...ev, exdates: [...(ev.exdates || []), occ || ev.date] }; removeEvent(id); putEvent(ex);
  closeModal(); toast('Afspraak verwijderd'); render();
};
actions['ev-del-all'] = () => { const { id } = modalCtx; removeEvent(id); closeModal(); toast('Reeks verwijderd'); render(); };
</script>
<script>
/* ---------- 5c. Studie ---------- */

  };
}
actions['st-tab'] = el => { ui.studie.tab = el.dataset.v; render(); };

/* gedeelde rijen */
function sessRow(s, date) {
  const c = courseLabel(s.course);
  const dl = s.deadlineId ? deadlines().find(d => d.id === s.deadlineId) : null;
  return `<li class="goal ${s.done ? 'is-done' : ''}">
    <button class="check ${ui.pop === 'st' + s.id ? 'pop' : ''}" data-act="study-toggle" data-date="${date}" data-id="${s.id}" aria-pressed="${!!s.done}" aria-label="${esc(s.task || c.name)}">${icon('check')}</button>
    <div class="goal-main"><div class="goal-top"><span class="goal-name">${esc(s.task || c.name)}</span>${s.part ? `<span class="badge">${esc(s.part)}</span>` : ''}</div>
      <div class="meta-line"><span class="dot" style="background:${c.color}"></span><span>${esc(c.name)}${s.time ? `, ${esc(s.time)}` : ''}, ${fmtMin(s.duration || 0)}${dl ? `, voor ${esc(dl.title)}` : ''}</span></div></div>

/* overzicht */
function studyOverview() {
  const t = today(), ws = weekStart(t), we = addDays(ws, 6);
  const todays = studyOn(t), tMin = todays.reduce((a, s) => a + (s.duration || 0), 0);
  const dm = studyMinutes(ws, we, true), pm = studyMinutes(ws, we, false);
  const open = deadlines().filter(d => !d.done), late = open.filter(d => d.date < t).length;
  const next = open.filter(d => d.date >= t).sort(sortDl)[0];
  const upcoming = [];
  for (let i = 1; i <= 7; i++) { const d = addDays(t, i), ss = studyOn(d).slice().sort(byTime); if (ss.length) upcoming.push([d, ss]); }
  const perCourse = {};
  for (const s of allStudy()) if (s.date >= ws && s.date <= we) { const p = perCourse[s.course || ''] = perCourse[s.course || ''] || { d: 0, p: 0 }; p.p += s.duration || 0; if (s.done) p.d += s.duration || 0; }
  const pcRows = Object.entries(perCourse).sort((a, b) => b[1].p - a[1].p).map(([id, v]) => { const c = courseLabel(id); return `<li><div class="sl-top"><span class="cat-tag"><i class="dot" style="background:${c.color}"></i>${esc(c.name)}</span><span class="faint small num">${fmtHours(v.d)} van ${fmtHours(v.p)}</span></div><div class="bar" style="--c:${c.color}"><i style="width:${v.p ? v.d / v.p * 100 : 0}%;background:var(--c)"></i></div></li>`; }).join('');
  return `<section class="card kpis">
      <div class="kpi"><span class="kpi-l">${icon('calendar')}Vandaag gepland</span><span class="kpi-v">${todays.length}<span class="kpi-of"> ${todays.length === 1 ? 'sessie' : 'sessies'}</span></span><span class="kpi-m">${tMin ? fmtMin(tMin) : 'Niets gepland'}</span></div>
      <div class="kpi"><span class="kpi-l">${icon('clock')}Deze week</span><span class="kpi-v">${fmtHours(dm)}<span class="kpi-of"> / ${fmtHours(pm)}</span></span><span class="kpi-m">Gestudeerd van gepland</span></div>
      <div class="kpi"><span class="kpi-l">${icon('flag')}Eerstvolgende deadline</span><span class="kpi-v">${next ? (diffDays(t, next.date) === 0 ? 'Vandaag' : diffDays(t, next.date) + (diffDays(t, next.date) === 1 ? ' dag' : ' dagen')) : '–'}</span><span class="kpi-m">${next ? esc(next.title) : 'Geen deadlines gepland'}</span></div>
      <div class="kpi"><span class="kpi-l">${icon('list')}Open deadlines</span><span class="kpi-v ${late ? 'neg' : ''}">${open.length}</span><span class="kpi-m">${late ? `${late} verlopen` : 'Niets verlopen'}</span></div>
    </section>
    <div class="dash">
      <div class="col">
        ${studyTodayCard(t)}
        <section class="card"><div class="card-h"><h2>Komende 7 dagen</h2><button class="link" data-act="st-view-to" data-v="lijst">Hele lijst${icon('chevR')}</button></div>
          ${upcoming.length ? upcoming.map(([d, ss]) => `<div class="ag-h">${fmtLong(d)}<span>${fmtMin(ss.reduce((a, s) => a + (s.duration || 0), 0))}</span></div><ul class="goals">${ss.map(s => sessRow(s, d)).join('')}</ul>`).join('')
            : empty('calendar', 'Nog niets gepland', 'Laat een planning maken richting een deadline, dan worden de sessies over de dagen verdeeld.', `<button class="btn btn-sm" data-act="gen-open">${icon('sparkles')}Planning maken</button>`)}
        </section>
      </div>
      <div class="col">
        ${deadlinesCard(6)}
        <section class="card"><div class="card-h"><h2>Per vak deze week</h2></div>
          ${pcRows ? `<ul class="stat-list">${pcRows}</ul>` : empty('cap', 'Nog geen sessies deze week', '')}</section>
      </div>
    </div>`;
}
actions['st-view-to'] = el => { ui.studie.tab = 'planning'; ui.studie.view = el.dataset.v; render(); };

/* planning */
function studyPlanning() {
  const st = ui.studie, t = today();
  let nav = '', title = '', body = '';
  if (st.view === 'week') {
    const ws = st.week, days = [0, 1, 2, 3, 4, 5, 6].map(i => addDays(ws, i)), cur = weekStart(t);
    nav = `<button class="btn btn-sm" data-act="st-week-to" data-v="${cur}" ${ws === cur ? 'disabled' : ''}>Deze week</button>${navArrows('st-week', false, false, 'Vorige week', 'Volgende week')}`;
    title = `${fmtRange(ws, days[6])}<span>${fmtHours(studyMinutes(ws, days[6], false))} gepland</span>`;
    body = `<div class="week-cal">${days.map((d, i) => {
      const dls = deadlines().filter(x => x.date === d).sort(sortDl), ss = studyOn(d).slice().sort(byTime);
      return `<div class="wc-day ${d === t ? 'today' : ''} ${d < t ? 'past' : ''}">
        <div class="wc-head"><span class="wc-wd">${WD[i]}</span><span class="wc-n">${parseISO(d).getDate()}</span></div>
        <div class="wc-body">
          ${dls.map(x => `<button class="event deadline ${x.done ? 'done' : ''}" data-act="dl-edit" data-id="${x.id}"><span class="event-t"><span>${esc(x.title)}</span>${x.done ? icon('check') : ''}</span><span class="event-s">${dlTypeLabel(x.type)}${x.time ? ', ' + esc(x.time) : ''}</span></button>`).join('')}
          ${ss.map(s => { const c = courseLabel(s.course); return `<button class="event ${s.done ? 'done' : ''}" style="--c:${c.color}" data-act="study-edit" data-date="${d}" data-id="${s.id}"><span class="event-t"><span>${esc(s.task || c.name)}</span>${s.done ? icon('check') : ''}</span><span class="event-s">${s.time ? esc(s.time) + ', ' : ''}${fmtMin(s.duration || 0)}</span>${s.task && s.course ? `<span class="event-g">${esc(c.name)}</span>` : ''}</button>`; }).join('')}
          <button class="wc-add" data-act="study-new" data-date="${d}" aria-label="Sessie plannen op ${fmtLong(d)}">${icon('plus')}<span>Sessie</span></button>
        </div></div>`;
    }).join('')}</div>`;
  } else if (st.view === 'maand') {
    const mk = st.month, cm = t.slice(0, 7), first = mk + '-01', last = monthEnd(first);
    nav = `<button class="btn btn-sm" data-act="st-month-to" data-v="${cm}" ${mk === cm ? 'disabled' : ''}>Deze maand</button>${navArrows('st-month', false, false, 'Vorige maand', 'Volgende maand')}`;
    title = `${fmtMonth(mk)}<span>${fmtHours(studyMinutes(first, last, false))} gepland</span>`;
    const cells = [];
    const start = weekStart(first);
    for (let d = start; d <= last || weekday(d) !== 0; d = addDays(d, 1)) {
      const out = d.slice(0, 7) !== mk, dls = deadlines().filter(x => x.date === d), ss = studyOn(d).slice().sort(byTime);
      const items = [...dls.map(x => `<button class="mc-pill dl" data-act="dl-edit" data-id="${x.id}" title="${esc(x.title)}">${esc(x.title)}</button>`),
        ...ss.map(s => { const c = courseLabel(s.course); return `<button class="mc-pill ${s.done ? 'done' : ''}" style="--c:${c.color}" data-act="study-edit" data-date="${d}" data-id="${s.id}" title="${esc(s.task || c.name)}">${esc(s.task || c.name)}</button>`; })];
      cells.push(`<div class="mc-cell ${out ? 'out' : ''} ${d === t ? 'today' : ''}" data-act="study-new" data-date="${d}">
        <span class="mc-n">${parseISO(d).getDate()}</span><div class="mc-items">${items.slice(0, 3).join('')}${items.length > 3 ? `<span class="mc-more">+${items.length - 3}</span>` : ''}</div></div>`);
    }
    body = `<div class="mcal">${WD.map(w => `<div class="mc-h">${w}</div>`).join('')}${cells.join('')}</div><p class="help">Klik op een dag om een sessie toe te voegen.</p>`;
  } else {
    title = 'Komende 6 weken';
    const groups = [];
    for (let i = 0; i < 42; i++) {
      const d = addDays(t, i), dls = deadlines().filter(x => x.date === d).sort(sortDl), ss = studyOn(d).slice().sort(byTime);
      if (dls.length || ss.length) groups.push(`<div class="ag-h">${i === 0 ? 'Vandaag' : i === 1 ? 'Morgen' : fmtLong(d)}<span>${ss.length ? fmtMin(ss.reduce((a, s) => a + (s.duration || 0), 0)) : ''}</span></div>
        <ul class="goals">${dls.map(dlRow).join('')}${ss.map(s => sessRow(s, d)).join('')}</ul>`);
    }
    body = `<section class="card">${groups.length ? groups.join('') : empty('calendar', 'Niets gepland', 'De komende zes weken staan nog geen sessies of deadlines.', `<button class="btn btn-sm" data-act="gen-open">${icon('sparkles')}Planning maken</button>`)}</section>`;
  }
  return `<div class="toolbar">${btnGroup('st-view', st.view, [['week', 'Week'], ['maand', 'Maand'], ['lijst', 'Lijst']])}${nav}<h2 class="tb-title">${title}</h2>
      <span class="spacer"></span><button class="btn btn-sm" data-act="study-new" data-date="${t}">${icon('plus')}Sessie</button></div>${body}`;
}
actions['st-view'] = el => { ui.studie.view = el.dataset.v; render(); };
actions['st-week'] = el => { ui.studie.week = addDays(ui.studie.week, 7 * el.dataset.n); render(); };

/* deadlines */
function studyDeadlines() {

  if (f === 'open') list = list.filter(d => !d.done).sort(sortDl);
  else if (f === 'done') list = list.filter(d => d.done).sort((a, b) => sortDl(b, a));
  else list.sort(sortDl);
  const planned = id => allStudy().filter(s => s.deadlineId === id);
  return `<div class="toolbar"><div class="pills">${pill('st-dl', 'open', 'Open', f === 'open')}${pill('st-dl', 'done', 'Afgerond', f === 'done')}${pill('st-dl', 'all', 'Alles', f === 'all')}</div>
      <span class="spacer"></span><button class="btn btn-sm" data-act="dl-new">${icon('plus')}Deadline</button></div>
    <section class="card">${list.length ? `<div class="table-wrap"><table class="table">
      <thead><tr><th style="width:44px"></th><th>Deadline</th><th class="hide-sm">Datum</th><th class="hide-md">Gepland</th><th class="ta-r">Status</th></tr></thead>
      <tbody>${list.map(d => {
        const c = courseLabel(d.course), ps = planned(d.id), pm = ps.reduce((a, s) => a + (s.duration || 0), 0), dm = ps.filter(s => s.done).reduce((a, s) => a + (s.duration || 0), 0);
        return `<tr data-act="dl-edit" data-id="${d.id}" tabindex="0" class="${d.done ? 'is-done' : ''}">
          <td><button class="check" data-act="dl-toggle" data-id="${d.id}" aria-pressed="${!!d.done}" aria-label="${esc(d.title)} afgerond">${icon('check')}</button></td>
          <td><div class="t"><span>${esc(d.title)}</span></div><div class="s"><span class="cat-tag"><i class="dot" style="background:${c.color}"></i>${esc(c.name)}, ${dlTypeLabel(d.type)}</span></div><div class="s show-sm">${fmtTxDate(d.date)}${d.time ? ' ' + esc(d.time) : ''}</div></td>
          <td class="hide-sm nowrap num">${fmtTxDate(d.date)}${d.time ? `<span class="faint"> ${esc(d.time)}</span>` : ''}</td>
          <td class="hide-md num">${pm ? `${fmtHours(dm)} / ${fmtHours(pm)}` : '<span class="faint">–</span>'}</td>
          <td class="ta-r">${countdown(d.date, d.done)}</td></tr>`;
      }).join('')}</tbody></table></div>`
      : empty('flag', f === 'done' ? 'Nog niets afgerond' : 'Geen deadlines', 'Voeg tentamens, inleverdata en presentaties toe.', `<button class="btn btn-primary btn-sm" data-act="dl-new">${icon('plus')}Deadline</button>`)}</section>`;
}
actions['st-dl'] = el => { ui.studie.dl = el.dataset.v; render(); };
actions['dl-toggle'] = el => {
  const d = deadlines().find(x => x.id === el.dataset.id); if (!d) return;

};

/* vakken */

actions['course-save'] = () => {

const courseOptions = cur => `<option value="">Geen vak</option>${S().courses.map(c => `<option value="${esc(c.id)}" ${c.id === cur ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}`;

/* studiesessie */

    <div class="row2">

    ${existing ? `<label class="switch"><input type="checkbox" id="ss-done" ${s.done ? 'checked' : ''}><span><strong>Afgerond</strong><small>Telt mee bij een doel dat aan studie gekoppeld is.</small></span></label>`
      : `<label class="field"><span class="lbl">Herhalen</span><select id="ss-rep"><option value="0">Alleen deze dag</option>${[1, 2, 3, 4, 6, 8, 12].map(n => `<option value="${n}">Elke week, nog ${n} keer</option>`).join('')}</select></label>`}
    ${S().courses.length ? '' : '<p class="help">Tip: voeg je vakken toe bij Studie, Vakken. Dan krijgt elk vak een eigen kleur.</p>'}`,

actions['study-new'] = (el, e) => { if (e && e.target.closest('.mc-pill')) return; openStudyModal(el.dataset.date || today(), null); };
actions['study-edit'] = el => openStudyModal(el.dataset.date, el.dataset.id);
actions['study-save'] = () => {
  const { date: oldDate, id } = modalCtx, date = $('#ss-date').value;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return formErr('Kies een datum.', '#ss-date');
  const prev = id ? studyOn(oldDate).find(s => s.id === id) : null;
  const item = { ...(prev || {}), id: id || newId(), course: $('#ss-course').value, task: $('#ss-task').value.trim(), duration: +$('#ss-dur').value || 60, time: $('#ss-time').value || '', deadlineId: $('#ss-dl') ? $('#ss-dl').value : (prev ? prev.deadlineId || '' : ''), done: $('#ss-done') ? $('#ss-done').checked : false };
  if (!item.task && !item.course) return formErr('Vul in wat je gaat doen of kies een vak.', '#ss-task');
  if (id && date === oldDate) setStudy(date, studyOn(date).map(s => s.id === id ? item : s));
  else { if (id) setStudy(oldDate, studyOn(oldDate).filter(s => s.id !== id)); setStudy(date, [...studyOn(date), item]); }
  const reps = id ? 0 : +(($('#ss-rep') || {}).value || 0);
  for (let i = 1; i <= reps; i++) { const d2 = addDays(date, 7 * i); setStudy(d2, [...studyOn(d2), { ...item, id: newId(), done: false }]); }
  closeModal(); toast(reps ? `Gepland voor ${reps + 1} weken` : id ? 'Sessie bijgewerkt' : 'Sessie gepland'); render();
};
actions['study-del'] = () => {

};

/* deadline */
function openDlModal(d) {
  const isNew = !d;
  d = d || { title: '', course: '', type: 'tentamen', date: addDays(today(), 14), time: '', notes: '' };
  const linked = isNew ? [] : allStudy().filter(s => s.deadlineId === d.id && !s.done);
  openModal(dlg(isNew ? 'Nieuwe deadline' : 'Deadline bewerken', `
    <label class="field"><span class="lbl">Titel</span><input id="dl-title" type="text" value="${esc(d.title)}" placeholder="Bijvoorbeeld Tentamen Statistiek"></label>

      <label class="field"><span class="lbl">Soort</span><select id="dl-type">${DL_TYPES.map(([v, l]) => `<option value="${v}" ${v === d.type ? 'selected' : ''}>${l}</option>`).join('')}</select></label>

    <div class="row2">

    ${isNew ? '<label class="switch"><input type="checkbox" id="dl-plan" checked><span><strong>Meteen een studieplanning maken</strong><small>Verdeel je studietijd over de dagen tot deze deadline.</small></span></label>'
      : linked.length ? `<p class="help">${linked.length} open ${linked.length === 1 ? 'sessie hoort' : 'sessies horen'} bij deze deadline. <button class="link" data-act="dl-clear-plan">Verwijderen</button></p>` : ''}`,
    dlgFoot('dl-save', 'Opslaan', isNew ? '' : `<button class="btn btn-ghost btn-danger" data-act="dl-del">${icon('trash')}Verwijderen</button><button class="btn" data-act="gen-for" data-id="${d.id}">${icon('sparkles')}Planning maken</button>`)),
    { id: isNew ? null : d.id }, isNew ? '#dl-title' : null);
}
actions['dl-new'] = () => openDlModal(null);
actions['dl-edit'] = (el, e) => { if (e && e.target.closest('[data-act="dl-toggle"]')) return; const d = deadlines().find(x => x.id === el.dataset.id); if (d) openDlModal(d); };
actions['dl-save'] = () => {
  const title = $('#dl-title').value.trim(); if (!title) return formErr('Geef de deadline een titel.', '#dl-title');
  const date = $('#dl-date').value; if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return formErr('Kies een datum.', '#dl-date');
  const data = { title, course: $('#dl-course').value, type: $('#dl-type').value, date, time: $('#dl-time').value || '', notes: $('#dl-notes').value.trim() };
  let id = modalCtx.id;
  if (id) Object.assign(deadlines().find(x => x.id === id), data);
  else { id = newId(); deadlines().push({ id, done: false, ...data }); }
  touchDl();
  const plan = $('#dl-plan') && $('#dl-plan').checked && date > today();
  closeModal(); toast('Deadline opgeslagen'); render();
  if (plan) openGenModal(id);
};
actions['dl-del'] = () => {
  const d = deadlines().find(x => x.id === modalCtx.id); if (!d) return;
  confirmBox(`${d.title} verwijderen?`, 'Studiesessies die erbij horen blijven in je planning staan.', 'Verwijderen', () => {
    const b = Store.ensure('deadlines', () => ({ items: [] })); b.items = b.items.filter(x => x.id !== d.id); touchDl(); render();
  });
};
actions['dl-clear-plan'] = () => {
  const id = modalCtx.id;
  for (const k of Object.keys(Store.b)) if (k.startsWith('study-')) for (const d of Object.keys(Store.b[k])) {
    const arr = Store.b[k][d], keep = arr.filter(s => !(s.deadlineId === id && !s.done));
    if (keep.length !== arr.length) setStudy(d, keep);

};

/* planning maken */
function openGenModal(dlId) {
  const t = today(), open = deadlines().filter(d => !d.done && d.date > t).sort(sortDl);
  const dl = open.find(d => d.id === dlId);
  openModal(dlg('Studieplanning maken', `
    <p class="dlg-text" style="margin-bottom:16px">Geef op hoeveel tijd je nodig hebt. De sessies worden gelijkmatig verdeeld over de dagen die je kiest.</p>
    <label class="field"><span class="lbl">Tot</span><select id="gen-dl" data-change="gen-prev">${open.map(d => `<option value="${d.id}" ${d.id === dlId ? 'selected' : ''}>${esc(d.title)}, ${fmtTxDate(d.date)}</option>`).join('')}<option value="" ${!dl ? 'selected' : ''}>Een eigen einddatum</option></select></label>
    <div id="gen-end-f" ${dl ? 'hidden' : ''}><label class="field"><span class="lbl">Einddatum</span><input id="gen-end" type="date" value="${addDays(t, 14)}" data-change="gen-prev"></label></div>
    <label class="field"><span class="lbl">Wat ga je doen?</span><input id="gen-task" type="text" value="${dl ? esc(dl.title.replace(/^(tentamen|inleveren)\s+/i, '')) + ' leren' : ''}" placeholder="Bijvoorbeeld Stof hoofdstuk 1 tot 6"></label>
    <div class="row2">
      <label class="field"><span class="lbl">Vak</span><select id="gen-course">${courseOptions(dl ? dl.course : '')}</select></label>
      <label class="field"><span class="lbl">Begin op</span><input id="gen-start" type="date" value="${t}" data-change="gen-prev"></label>
    </div>
    <div class="row2">
      <label class="field"><span class="lbl">Totaal aantal uren</span><input id="gen-hours" type="text" inputmode="decimal" value="10" data-input="gen-prev"></label>
      <label class="field"><span class="lbl">Per sessie</span><select id="gen-len" data-change="gen-prev">${[30, 45, 60, 90, 120, 180].map(m => `<option value="${m}" ${m === 90 ? 'selected' : ''}>${fmtMin(m)}</option>`).join('')}</select></label>
    </div>
    <div class="field"><span class="lbl">Op welke dagen?</span><div id="gen-days" class="days-pick" style="margin-top:0">${WD.map((w, i) => `<button type="button" data-act="gen-day" data-d="${i}" aria-pressed="${i < 5}">${w}</button>`).join('')}</div></div>
    <label class="field"><span class="lbl">Tijd <span class="faint">(optioneel)</span></span><input id="gen-time" type="time" value="" style="max-width:160px"></label>
    <div class="gen-prev" id="gen-prev"></div>`,
    dlgFoot('gen-save', 'Planning toevoegen')), {});
  genPreview();
}
function genCompute() {
  const dlId = $('#gen-dl').value, dl = deadlines().find(d => d.id === dlId);
  const end = dl ? addDays(dl.date, -1) : $('#gen-end').value;
  const start = $('#gen-start').value || today();
  const hours = parseNum($('#gen-hours').value), len = +$('#gen-len').value;
  const days = $$('#gen-days [aria-pressed="true"]').map(b => +b.dataset.d);
  if (!(hours > 0)) return { err: 'Vul het aantal uren in.' };
  if (!days.length) return { err: 'Kies minstens één dag.' };
  if (!end || end < start) return { err: dl ? 'Deze deadline ligt te dichtbij om nog te plannen.' : 'Kies een einddatum na de begindatum.' };
  const dates = [];
  for (let d = start; d <= end && dates.length < 800; d = addDays(d, 1)) if (days.includes(weekday(d))) dates.push(d);
  if (!dates.length) return { err: 'Er vallen geen gekozen dagen in deze periode.' };
  const n = Math.ceil(hours * 60 / len);
  const plan = Array.from({ length: n }, (_, i) => dates[Math.floor(i * dates.length / n)]);
  const perDay = Math.max(...Object.values(plan.reduce((m, d) => (m[d] = (m[d] || 0) + 1, m), {})));
  return { plan, n, len, dl, perDay, unique: new Set(plan).size };
}
function genPreview() {
  const box = $('#gen-prev'); if (!box) return;
  const dlSel = $('#gen-dl'); $('#gen-end-f').hidden = !!dlSel.value;
  const r = genCompute();
  if (r.err) { box.innerHTML = `<span class="neg">${esc(r.err)}</span>`; return; }
  const weeks = Math.max(1, diffDays(r.plan[0], r.plan[r.plan.length - 1]) / 7);
  box.innerHTML = `${icon('calendar')}<span><b>${r.n} ${r.n === 1 ? 'sessie' : 'sessies'}</b> van ${fmtMin(r.len)}, van ${fmtDayLong(r.plan[0])} t/m ${fmtDayLong(r.plan[r.plan.length - 1])}. Ongeveer ${fmtHours(Math.round(r.n * r.len / weeks))} per week.${r.perDay > 1 ? ` Op sommige dagen staan ${r.perDay} sessies, kies meer dagen of langere sessies als dat te veel is.` : ''}</span>`;
}
actions['gen-open'] = () => openGenModal(null);
actions['gen-for'] = el => { const id = el.dataset.id; closeModal(); openGenModal(id); };
actions['gen-day'] = el => { el.setAttribute('aria-pressed', String(el.getAttribute('aria-pressed') !== 'true')); genPreview(); };
changes['gen-prev'] = () => genPreview();
inputs['gen-prev'] = () => genPreview();
actions['gen-save'] = () => {
  const r = genCompute(); if (r.err) return formErr(r.err);
  const task = $('#gen-task').value.trim(), course = $('#gen-course').value, time = $('#gen-time').value || '';
  const byDate = {};
  r.plan.forEach((d, i) => (byDate[d] = byDate[d] || []).push({ id: newId(), course, task: task || (r.dl ? r.dl.title : 'Studeren'), duration: r.len, time, done: false, deadlineId: r.dl ? r.dl.id : '', part: `${i + 1}/${r.n}` }));
  for (const [d, items] of Object.entries(byDate)) setStudy(d, [...studyOn(d), ...items]);
  closeModal();
  Object.assign(ui.studie, { tab: 'planning', view: 'lijst' });
  toast(`${r.n} ${r.n === 1 ? 'sessie' : 'sessies'} gepland`);
  if (route === 'studie') render(); else go('studie');
};

<script>
/* ---------- 5c. Financiën ---------- */
registerModule({ id: 'financien', label: 'Financiën', icon: 'wallet', order: 50, render: renderFinance });

const PERIODS = [['month', 'Deze maand'], ['3m', '3 maanden'], ['year', 'Dit jaar'], ['lastyear', 'Vorig jaar'], ['all', 'Alles'], ['custom', 'Aangepast']];
function periodRange(p) {
  const t = today(), y = +t.slice(0, 4);
  if (p === 'month') return [monthStart(t), monthEnd(t)];
  if (p === 'prevmonth') { const mk = addMonths(t.slice(0, 7), -1); return [mk + '-01', monthEnd(mk + '-01')]; }
  if (p === '3m') return [addMonths(t.slice(0, 7), -2) + '-01', monthEnd(t)];
  if (p === 'year') return [`${y}-01-01`, `${y}-12-31`];
  if (p === 'lastyear') return [`${y - 1}-01-01`, `${y - 1}-12-31`];
  if (p === 'custom') { let a = ui.fin.from || t, b = ui.fin.to || t; if (a > b) [a, b] = [b, a]; return [a, b]; }
  if (p && p.startsWith('m:')) { const mk = p.slice(2); return [mk + '-01', monthEnd(mk + '-01')]; }
  const all = allTx(); if (!all.length) return [monthStart(t), monthEnd(t)];
  let mn = all[0].date, mx = all[0].date;
  for (const x of all) { if (x.date < mn) mn = x.date; if (x.date > mx) mx = x.date; }
  return [monthStart(mn), mx > t ? mx : t];
}
function monthsBetween(a, b) { const out = []; let mk = a.slice(0, 7); const end = b.slice(0, 7); while (mk <= end && out.length < 600) { out.push(mk); mk = addMonths(mk, 1); } return out; }
const fmtRangeLong = (a, b) => `${fmtDayLong(a)} ${a.slice(0, 4)} t/m ${fmtDayLong(b)} ${b.slice(0, 4)}`;

function renderFinance() {
  const f = ui.fin;
  return {
    title: 'Financiën',
    sub: `Saldo ${eur(balance())}`,
    tabs: tabs('fin-tab', f.tab, [['overzicht', 'Overzicht'], ['transacties', 'Transacties'], ['maanden', 'Per maand'], ['abonnementen', 'Abonnementen']]),
    body: { overzicht: finOverview, transacties: finList, maanden: finMonths, abonnementen: finSubs }[f.tab]()
  };
}
actions['fin-tab'] = el => { ui.fin.tab = el.dataset.v; render(); };

function finOverview() {
  const f = ui.fin, t = today();
  const [a, b] = periodRange(f.period);
  const list = txIn(a, b), s = sums(list);
  const avgEnd = b < t ? b : t;
  const months = a <= avgEnd ? monthsBetween(a, avgEnd) : [a.slice(0, 7)];
  const n = Math.max(1, months.length);
  const custom = f.period === 'custom' ? `<input type="date" data-change="fin-from" value="${f.from}" aria-label="Van" style="width:auto"><span class="faint">t/m</span><input type="date" data-change="fin-to" value="${f.to}" aria-label="Tot en met" style="width:auto">` : '';
  const kept = s.inc > 0 ? Math.round(s.net / s.inc * 100) : null;

  let resParts = [], c1 = '', c2 = '';
  if (s.inc > 0 || s.out > 0) {
    if (s.net >= 0) { resParts = [{ label: 'Uitgegeven', value: s.out, color: 'var(--c-out)' }, { label: 'Overgehouden', value: s.net, color: 'var(--accent)' }]; c1 = (s.inc ? Math.round(s.out / s.inc * 100) : 0) + '%'; c2 = 'uitgegeven'; }
    else { resParts = [{ label: 'Betaald uit inkomsten', value: s.inc, color: 'var(--c-out)' }, { label: 'Tekort', value: -s.net, color: 'var(--danger)' }]; c1 = eur(-s.net); c2 = 'tekort'; }
  }
  const resTotal = resParts.reduce((x, p) => x + p.value, 0);
  const legendRows = (parts, total) => parts.map(p => `<li><span class="dot" style="background:${p.color}"></span><span>${esc(p.label)}</span><span class="amt">${eur(p.value)}</span><span>${total ? Math.round(p.value / total * 100) : 0}%</span></li>`).join('');

  const type = f.pie, byCat = {};
  for (const x of list) if (x.type === type) byCat[x.category] = (byCat[x.category] || 0) + x.amount;
  const parts = Object.entries(byCat).map(([id, v]) => { const c = catById(type, id); return { label: c ? c.name : 'Zonder categorie', color: c ? c.color : '#A1A1AA', value: v }; }).sort((p, q) => q.value - p.value);
  const total = parts.reduce((x, p) => x + p.value, 0);

  const trend = months.length >= 2 ? `<section class="card" style="margin-top:16px">
      <div class="card-h"><h2>Verloop per maand</h2><div class="legend-inline"><span><i style="background:var(--accent)"></i>Inkomsten</span><span><i style="background:var(--c-out)"></i>Uitgaven</span></div></div>
      ${barChart(months.slice(-24).map(mk => { const ms = sums(list.filter(x => x.date.startsWith(mk))); return { label: fmtMonthShort(mk) + (mk.endsWith('-01') || mk === months[0] ? ' ' + mk.slice(2, 4) : ''), title: `${fmtMonth(mk)}: ${eur(ms.inc)} in, ${eur(ms.out)} uit`, bars: [{ v: ms.inc, cls: 'bar-in' }, { v: ms.out, cls: 'bar-out' }] }; }), v => EUR0.format(v))}
    </section>` : '';

  return `<div class="toolbar">${btnGroup('fin-period', f.period, PERIODS)}${custom}<span class="spacer"></span><span class="tb-range">${fmtRangeLong(a, b)}</span></div>
    <section class="card kpis">
      <div class="kpi"><span class="kpi-l">${icon('arrowIn')}Inkomsten</span><span class="kpi-v">${eur(s.inc)}</span><span class="kpi-m">${n > 1 ? `Gemiddeld ${eur(s.inc / n)} per maand` : `${list.filter(x => x.type === 'in').length} transacties`}</span></div>

      <div class="kpi"><span class="kpi-l">${icon('pie')}Overgehouden</span><span class="kpi-v ${kept != null && kept < 0 ? 'neg' : ''}">${kept == null ? '–' : kept + '%'}</span><span class="kpi-m">Van je inkomsten</span></div>
    </section>
    <div class="grid-2 stretch" style="margin-top:16px;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)">
      <section class="card"><div class="card-h"><h2>Resultaat</h2></div>
        ${resParts.length ? `<div class="pie-wrap">${donut(resParts, resTotal, c1, c2, 'Resultaat van de periode')}<ul class="legend">${legendRows(resParts, resTotal)}</ul></div>` : empty('pie', 'Geen transacties', 'In deze periode zijn nog geen inkomsten of uitgaven.')}
      </section>
      <section class="card"><div class="card-h"><h2>Per categorie</h2>${seg('fin-pie', type, [['out', 'Uitgaven'], ['in', 'Inkomsten']], 'inline')}</div>
        ${parts.length ? `<div class="pie-wrap">${donut(parts, total, eur(total), type === 'out' ? 'uitgegeven' : 'ontvangen', 'Verdeling per categorie')}<ul class="legend">${legendRows(parts, total)}</ul></div>` : empty('pie', type === 'out' ? 'Geen uitgaven' : 'Geen inkomsten', 'Kies een andere periode of voeg een transactie toe.')}
      </section>
    </div>
    ${trend}`;
}
actions['fin-period'] = el => { ui.fin.period = el.dataset.v; render(); };
actions['fin-pie'] = el => { ui.fin.pie = el.dataset.v; render(); };
changes['fin-from'] = el => { ui.fin.from = el.value || today(); render(); };
changes['fin-to'] = el => { ui.fin.to = el.value || today(); render(); };

function finList() {
  const f = ui.fin, s0 = S();
  let list = allTx();
  if (f.fper !== 'all') { const [a, b] = periodRange(f.fper); list = list.filter(x => x.date >= a && x.date <= b); }

  if (q) list = list.filter(x => (x.description || '').toLowerCase().includes(q) || catLabel(x).toLowerCase().includes(q) || (x.account || '').toLowerCase().includes(q) || String(x.amount).includes(q.replace(',', '.')));

  list = list.slice().sort((x, y) => { const v = key === 'date' ? (x.date < y.date ? -1 : x.date > y.date ? 1 : 0) : x.amount - y.amount; return dir === 'asc' ? v : -v; });
  const s = sums(list);
  const opt = (v, l, cur) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(l)}</option>`;
  const monthOpt = f.fper.startsWith('m:') ? opt(f.fper, fmtMonth(f.fper.slice(2)), f.fper) : '';
  const sel = (ch, label, html) => `<select data-change="${ch}" aria-label="${label}" style="width:auto;max-width:100%">${html}</select>`;
  const filters = `<div class="toolbar">
      <label class="search">${icon('search')}<input id="tx-q" type="search" placeholder="Zoeken" value="${esc(f.q)}" data-input="fin-q" aria-label="Zoek op beschrijving, categorie of bedrag"></label>

      ${sel('fin-cat', 'Categorie', opt('all', 'Alle categorieën', f.cat) + `<optgroup label="Uitgaven">${s0.categories.out.map(c => opt(c.id, c.name, f.cat)).join('')}</optgroup><optgroup label="Inkomsten">${s0.categories.in.map(c => opt(c.id, c.name, f.cat)).join('')}</optgroup>`)}
      ${sel('fin-sort', 'Sorteren', opt('date-desc', 'Nieuwste eerst', f.sort) + opt('date-asc', 'Oudste eerst', f.sort) + opt('amount-desc', 'Hoogste bedrag', f.sort) + opt('amount-asc', 'Laagste bedrag', f.sort))}

  return `${filters}
    <section class="card"><div class="table-wrap"><table class="table">

      <tbody>${list.map(x => `<tr data-act="tx-edit" data-id="${x.id}" tabindex="0">

        <td><div class="cell-main">${catIcon(x)}<div class="grow"><div class="t"><span>${esc(x.description || catLabel(x))}</span>${x.recurringId ? icon('repeat') : ''}</div><div class="s show-sm">${fmtTxDate(x.date)}, ${esc(catLabel(x))}</div></div></div></td>
        <td class="hide-sm"><span class="cat-tag"><i class="dot" style="background:${catColor(x)}"></i>${esc(catLabel(x))}</span></td>
        <td class="hide-md faint">${esc(x.account || '')}</td>

function catOptions(type, cur) { return S().categories[type].map(c => `<option value="${esc(c.id)}" ${c.id === cur ? 'selected' : ''}>${esc(c.name)}</option>`).join(''); }
function openTxModal(tx) {

    tx.recurringId = r.id; S().recurring.push(r); touchS();
  }

  return `<div class="toolbar"><span class="tb-range">Vaste lasten worden automatisch als transactie toegevoegd op de dag dat ze betaald worden.</span><span class="spacer"></span><button class="btn btn-sm" data-act="sub-new">${icon('plus')}Abonnement toevoegen</button></div>
    <section class="card kpis">

        : empty('repeat', 'Nog geen abonnementen', 'Voeg bijvoorbeeld je huur, telefoon, sportschool of streamingdiensten toe.', `<button class="btn btn-primary btn-sm" data-act="sub-new">${icon('plus')}Abonnement toevoegen</button>`)}

function openSubModal(r) {

}
actions['sub-new'] = () => openSubModal(null);
actions['sub-edit'] = el => { const r = S().recurring.find(x => x.id === el.dataset.id); if (r) openSubModal(r); };

<script>
/* ---------- 5d. Sport ---------- */
registerModule({ id: 'sport', label: 'Sport', icon: 'activity', order: 60, render: renderSport });

function renderSport() {
  const s = ui.sport;
  if (!s.lib || !sportById(s.lib)) s.lib = (S().sports[0] || {}).id || null;
  const t = today(), wl = allLogs().filter(l => l.date >= weekStart(t) && l.date <= addDays(weekStart(t), 6));
  return {
    title: 'Sport',
    sub: wl.length ? `Deze week ${wl.length} ${wl.length === 1 ? 'training' : 'trainingen'} gelogd` : 'Trainingskalender, geschiedenis en je Training Library',
    actions: `<button class="btn" data-act="log-new">${icon('activity')}Training loggen</button>`,
    tabs: tabs('sport-tab', s.tab, [['kalender', 'Kalender'], ['geschiedenis', 'Geschiedenis'], ['records', 'Records'], ['doelen', 'Doelen'], ['library', 'Training Library']]),
    body: { kalender: sportCal, geschiedenis: sportHistory, records: sportRecordsView, doelen: sportGoalsView, library: sportLibrary }[s.tab]()
  };
}
actions['sport-tab'] = el => { ui.sport.tab = el.dataset.v; render(); };

function deadlineBadge(g) {
  if (g.done) return `<span class="badge badge-green">${icon('check')}Behaald</span>`;
  if (!g.deadline) return '<span class="badge">Geen deadline</span>';
  const n = diffDays(today(), g.deadline);
  if (n > 14) return `<span class="badge">Nog ${n} dagen</span>`;
  if (n > 1) return `<span class="badge badge-amber">Nog ${n} dagen</span>`;
  if (n === 1) return '<span class="badge badge-amber">Morgen</span>';
  if (n === 0) return '<span class="badge badge-amber">Vandaag</span>';
  return '<span class="badge badge-red">Verstreken</span>';
}

function sportCal() {
  const ws = ui.sport.week, t = today(), cur = weekStart(t);
  const days = [0, 1, 2, 3, 4, 5, 6].map(i => addDays(ws, i));
  const name = ws === cur ? 'Deze week' : ws === addDays(cur, 7) ? 'Volgende week' : ws === addDays(cur, -7) ? 'Vorige week' : 'Week';
  const active = S().sportGoals.filter(g => !g.done);
  const tiles = active.length ? `<div class="goal-tiles">${active.map(g => { const fc = forecast(g); return `<button class="card goal-tile" data-act="sg-edit" data-id="${g.id}" style="text-align:left;cursor:pointer">${icon('flag')}<span class="grow"><strong>${esc(g.title)}</strong><span class="faint small" style="display:block">${sportLabel(g.sport).emoji} ${esc(sportLabel(g.sport).name)}${g.deadline ? `, tot ${fmtDayLong(g.deadline)}` : ''}</span>${fc ? `<span class="small" style="display:block;margin-top:4px">${fc.text}</span>` : ''}</span>${fc && fc.badge ? fc.badge : deadlineBadge(g)}</button>`; }).join('')}</div>` : '';
  const cols = days.map((d, i) => {
    const plans = planOn(d), logs = logsOn(d);
    const evs = plans.map(p => {
      const s = sportLabel(p.sport), rest = p.sport === 'rest', done = !rest && logs.some(l => l.sport === p.sport);
      return `<button class="event ${rest ? 'rest' : ''}" style="--c:${s.color}" data-act="plan-edit" data-date="${d}" data-pid="${p.id}">
        <span class="event-t"><span>${s.emoji} ${esc(rest ? 'Rustdag' : s.name)}</span>${done ? icon('check') : ''}</span>
        ${p.type ? `<span class="event-s">${esc(p.type)}</span>` : ''}${p.duration ? `<span class="event-s">${fmtMin(p.duration)}</span>` : ''}
        ${p.goal ? `<span class="event-g">${esc(p.goal)}</span>` : ''}</button>`;
    }).join('');
    const extra = logs.filter(l => !plans.some(p => p.sport === l.sport)).map(l => `<button class="event logged" style="--c:${sportColor(l.sport)}" data-act="log-edit" data-id="${l.id}"><span class="event-t"><span>${sportLabel(l.sport).emoji} ${esc(sportLabel(l.sport).name)}</span>${icon('check')}</span><span class="event-s">Gelogd, niet gepland</span></button>`).join('');
    return `<div class="wc-day ${d === t ? 'today' : ''} ${d < t ? 'past' : ''}">
      <div class="wc-head"><span class="wc-wd">${WD[i]}</span><span class="wc-n">${parseISO(d).getDate()}</span></div>
      <div class="wc-body">${evs}${extra}<button class="wc-add" data-act="plan-new" data-date="${d}" aria-label="Training plannen op ${fmtLong(d)}">${icon('plus')}<span>Plannen</span></button></div>
    </div>`;
  }).join('');
  return `${tiles}<div class="toolbar">
      <button class="btn btn-sm" data-act="sport-week-to" data-v="${cur}" ${ws === cur ? 'disabled' : ''}>Deze week</button>
      ${navArrows('sport-week', false, false, 'Vorige week', 'Volgende week')}
      <h2 class="tb-title">${fmtRange(ws, days[6])}${name !== 'Week' ? `<span>${name}</span>` : ''}</h2>
      <span class="spacer"></span>
      <button class="btn btn-sm" data-act="plan-copy-week">${icon('copy')}Kopieer naar volgende week</button>
    </div>
    <div class="week-cal">${cols}</div>`;
}
actions['sport-week'] = el => { ui.sport.week = addDays(ui.sport.week, 7 * el.dataset.n); render(); };
actions['sport-week-to'] = el => { ui.sport.week = el.dataset.v; render(); };
actions['plan-copy-week'] = () => {
  const ws = ui.sport.week; let n = 0;
  for (let i = 0; i < 7; i++) {
    const d = addDays(ws, i), d2 = addDays(d, 7), src = planOn(d);
    if (src.length && !planOn(d2).length) { setPlan(d2, src.map(p => ({ ...p, id: newId() }))); n++; }
  }
  if (!n) { toast('Niets gekopieerd: deze week is leeg of volgende week is al gevuld'); return; }
  ui.sport.week = addDays(ws, 7);
  toast(`${n} ${n === 1 ? 'dag' : 'dagen'} gekopieerd naar volgende week`); render();
};

/* plannen */

  let o = S().sports.map(x => `<option value="${esc(x.id)}" ${x.id === cur ? 'selected' : ''}>${x.emoji} ${esc(x.name)}</option>`).join('');
  if (cur && cur !== 'rest' && !sportById(cur)) o += `<option value="${esc(cur)}" selected>Verwijderde sport</option>`;
  if (withRest) o += `<option value="rest" ${cur === 'rest' ? 'selected' : ''}>😴 Rustdag</option>`;
  return o;
}
function openPlanModal(date, pid) {
  const existing = pid ? planOn(date).find(p => p.id === pid) : null;
